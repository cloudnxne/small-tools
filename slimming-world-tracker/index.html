<meta charset="UTF-8">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#c85a2e">
<title>Slimming World Tracker</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Georgia, serif; background: #fdf8f4; color: #2d2118; min-height: 100vh; }
  .header { background: linear-gradient(135deg, #c85a2e 0%, #e8834d 60%, #f5a97a 100%); padding: 22px 20px 14px; text-align: center; box-shadow: 0 4px 20px rgba(200,90,46,0.25); }
  .header-eyebrow { font-size: 10px; letter-spacing: 4px; text-transform: uppercase; color: rgba(255,255,255,0.75); margin-bottom: 4px; }
  .header h1 { font-size: 26px; font-weight: 700; color: #fff; letter-spacing: -0.5px; }
  .header-date { font-size: 13px; color: rgba(255,255,255,0.8); margin-top: 3px; }
  .tabs { display: flex; background: #fff; border-bottom: 1px solid #ede0d4; }
  .tab { flex: 1; padding: 12px 0; border: none; background: none; cursor: pointer; font-size: 14px; font-family: Georgia, serif; color: #8a6a56; border-bottom: 2px solid transparent; transition: all 0.2s; }
  .tab.active { color: #c85a2e; border-bottom-color: #c85a2e; font-weight: 700; }
  .content { max-width: 500px; margin: 0 auto; padding: 18px 14px 60px; }
  .card { background: #fff; border-radius: 16px; padding: 18px; margin-bottom: 14px; box-shadow: 0 2px 12px rgba(0,0,0,0.06); border: 1px solid #f0e4d8; }
  .card-label { font-size: 11px; color: #8a6a56; letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 10px; }
  .card-sublabel { font-size: 12px; color: #bba898; margin-bottom: 12px; margin-top: -6px; }
  .syn-count { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }
  .syn-number { font-size: 24px; font-weight: 700; }
  .syn-bar-bg { height: 10px; background: #f0e4d8; border-radius: 99px; overflow: hidden; }
  .syn-bar-fill { height: 100%; border-radius: 99px; transition: width 0.4s ease; }
  .syn-remaining { margin-top: 8px; font-size: 13px; font-weight: 600; text-align: right; }
  .input-row { display: flex; gap: 8px; margin-bottom: 0; }
  input[type=text], input[type=number], input[type=date] {
    width: 100%; padding: 10px 14px; border-radius: 10px; border: 1.5px solid #e8d8cc;
    font-size: 14px; font-family: Georgia, serif; background: #fdf8f4; color: #2d2118;
    outline: none; transition: border-color 0.2s;
  }
  input:focus { border-color: #c85a2e; }
  .btn { padding: 10px 18px; border-radius: 10px; border: none; background: linear-gradient(135deg, #c85a2e, #e8834d); color: #fff; font-family: Georgia, serif; font-size: 14px; font-weight: 700; cursor: pointer; white-space: nowrap; transition: opacity 0.2s; }
  .btn:disabled { opacity: 0.4; cursor: default; }
  .btn-blue { background: linear-gradient(135deg, #5a7fc8, #7a9fe8); }
  .btn-green { background: linear-gradient(135deg, #16a34a, #4ade80); }
  .btn-grey { background: #e8d8cc; color: #5a3e30; }
  .btn-full { width: 100%; margin-top: 8px; }
  .lookup-result { margin-top: 12px; padding: 14px; border-radius: 12px; }
  .lookup-result.syns { background: #fef9ec; border: 1.5px solid #fcd34d; }
  .lookup-result.free { background: #f0fdf4; border: 1.5px solid #86efac; }
  .lookup-result.none { background: #fef2f2; border: 1.5px solid #fca5a5; }
  .lookup-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
  .lookup-food { font-size: 14px; font-weight: 700; color: #2d2118; }
  .lookup-value { font-size: 20px; font-weight: 700; }
  .lookup-note { font-size: 12px; color: #8a6a56; margin-bottom: 8px; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 99px; font-size: 10px; margin-left: 6px; }
  .badge-book { background: #dbeafe; color: #1e40af; }
  .badge-free { background: #dcfce7; color: #16a34a; }
  .adjust-row { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
  .adjust-row span { font-size: 12px; color: #8a6a56; }
  .adjust-row input { width: 80px; padding: 6px 10px; flex: none; }
  .he-row { display: flex; gap: 10px; }
  .he-btn { flex: 1; padding: 12px 10px; border-radius: 12px; border: 2px solid #e8d8cc; background: #fff; cursor: pointer; text-align: center; transition: all 0.2s; }
  .he-btn.active { border-color: #c85a2e; background: #fef0e8; }
  .he-icon { font-size: 16px; }
  .he-label { font-size: 13px; font-weight: 700; color: #2d2118; margin-top: 4px; }
  .he-desc { font-size: 11px; color: #a08070; margin-top: 2px; }
  .meal-types { display: flex; gap: 6px; margin-bottom: 8px; flex-wrap: wrap; }
  .meal-type-btn { padding: 5px 12px; border-radius: 99px; border: 1.5px solid #e8d8cc; background: #fff; cursor: pointer; font-size: 12px; color: #8a6a56; font-family: Georgia, serif; transition: all 0.2s; }
  .meal-type-btn.active { border-color: #c85a2e; background: #fef0e8; color: #c85a2e; }
  .log-list { margin-top: 14px; border-top: 1px solid #f0e4d8; padding-top: 12px; }
  .log-item { display: flex; justify-content: space-between; align-items: center; padding: 7px 0; border-bottom: 1px solid #f5ece4; }
  .log-item:last-child { border-bottom: none; }
  .log-item-name { font-size: 14px; }
  .log-item-time { color: #bba898; font-size: 12px; margin-left: 6px; }
  .log-item-right { display: flex; align-items: center; gap: 10px; }
  .log-syn-val { font-weight: 700; color: #c85a2e; }
  .remove-btn { background: none; border: none; cursor: pointer; color: #cbb8ae; font-size: 16px; padding: 0; line-height: 1; }
  .section-label { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; font-weight: 700; margin-bottom: 4px; }
  .section-label.orange { color: #c85a2e; }
  .section-label.green { color: #16a34a; }
  .meal-section { margin-bottom: 10px; }
  .history-card { background: #fff; border-radius: 14px; padding: 16px; margin-bottom: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); border: 1px solid #f0e4d8; }
  .history-card.over { border-color: #fecaca; }
  .history-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .history-date { font-weight: 700; font-size: 15px; }
  .history-syns { font-weight: 700; font-size: 15px; }
  .history-meals { font-size: 13px; color: #8a6a56; }
  .history-tags { display: flex; gap: 8px; margin-top: 8px; }
  .he-tag { font-size: 11px; background: #fef0e8; color: #c85a2e; padding: 2px 8px; border-radius: 99px; border: 1px solid #f5c9a8; }
  .weight-banner { background: linear-gradient(135deg, #c85a2e, #f5a97a); border-radius: 16px; padding: 20px; margin-bottom: 16px; color: #fff; text-align: center; }
  .weight-banner-label { font-size: 11px; opacity: 0.85; letter-spacing: 2px; text-transform: uppercase; }
  .weight-banner-num { font-size: 36px; font-weight: 700; margin-top: 4px; }
  .weight-banner-sub { font-size: 13px; opacity: 0.8; margin-top: 4px; }
  .weight-log-item { display: flex; justify-content: space-between; align-items: center; padding: 9px 0; border-bottom: 1px solid #f5ece4; }
  .weight-log-item:last-child { border-bottom: none; }
  .weight-date { font-size: 14px; font-weight: 600; }
  .weight-diff { font-size: 12px; }
  .weight-right { display: flex; align-items: center; gap: 10px; }
  .weight-val { font-weight: 700; font-size: 16px; }
  .empty-state { text-align: center; color: #bba898; padding: 40px 0; font-size: 15px; }

  /* Search results */
  .search-results { margin-top: 10px; border: 1.5px solid #e8d8cc; border-radius: 10px; overflow: hidden; max-height: 220px; overflow-y: auto; }
  .search-result-item { padding: 10px 14px; cursor: pointer; border-bottom: 1px solid #f5ece4; display: flex; justify-content: space-between; align-items: center; transition: background 0.15s; }
  .search-result-item:last-child { border-bottom: none; }
  .search-result-item:hover { background: #fef0e8; }
  .search-result-name { font-size: 13px; color: #2d2118; }
  .search-result-note { font-size: 11px; color: #bba898; }
  .search-result-syns { font-weight: 700; font-size: 14px; color: #c85a2e; }
  .search-result-free { font-weight: 700; font-size: 13px; color: #16a34a; }
  .no-results { padding: 12px 14px; font-size: 13px; color: #bba898; }

  @media (max-width: 380px) {
    .header h1 { font-size: 22px; }
    .content { padding: 14px 10px 60px; }
  }
</style>
</head>

function getToday() {
  return new Date().toISOString().split('T')[0];

function fmtDate(d) {
  return new Date(d + 'T12:00:00').toLocaleDateString('en-GB', {weekday:'short', day:'numeric', month:'short'});
}
function getData() {
  try { return JSON.parse(localStorage.getItem('sw_days') || '{}'); } catch { return {}; }
}
function saveData(d) { localStorage.setItem('sw_days', JSON.stringify(d)); }
function getWeights() {
  try { return JSON.parse(localStorage.getItem('sw_weights') || '[]'); } catch { return []; }
}
function saveWeights(w) { localStorage.setItem('sw_weights', JSON.stringify(w)); }
function getTodayData() {
  const d = getData(); const k = getToday();
  return d[k] || {syns:[], meals:[], heA:false, heB:false};
}
function setTodayData(td) {
  const d = getData(); d[getToday()] = td; saveData(d);
}

// ============================================================
// SEARCH
// ============================================================
function searchSyns(query) {
  if (!query || query.length < 2) return [];
  const q = query.toLowerCase();
  const words = q.split(/\s+/).filter(w => w.length > 1);
  const results = SYN_DB.filter(item => {
    const n = item.name.toLowerCase();
    return words.every(w => n.includes(w)) || n.includes(q);
  });
  results.sort((a, b) => {
    const an = a.name.toLowerCase(), bn = b.name.toLowerCase();
    const aStarts = an.startsWith(q) ? 0 : 1;
    const bStarts = bn.startsWith(q) ? 0 : 1;
    if (aStarts !== bStarts) return aStarts - bStarts;
    return an.length - bn.length;
  });
  return results.slice(0, 8);
}

// ============================================================
function render() {
  document.getElementById('headerDate').textContent = fmtDate(getToday());
  document.querySelectorAll('.tab').forEach((t, i) => {
    t.classList.toggle('active', ['today','history','weight'][i] === currentTab);
  });
  document.getElementById('tab-today').style.display = currentTab === 'today' ? '' : 'none';
  document.getElementById('tab-history').style.display = currentTab === 'history' ? '' : 'none';
  document.getElementById('tab-weight').style.display = currentTab === 'weight' ? '' : 'none';
  if (currentTab === 'today') renderToday();
  if (currentTab === 'history') renderHistory();
  if (currentTab === 'weight') renderWeight();
}

function renderToday() {
  const td = getTodayData();
  const totalSyns = td.syns.reduce((a,s) => a + Number(s.value), 0);
  const remaining = DAILY_SYNS - totalSyns;
  const pct = Math.min(100, (totalSyns / DAILY_SYNS) * 100);
  const synColor = remaining < 0 ? '#ef4444' : remaining <= 1 ? '#f97316' : '#22c55e';
  const barBg = remaining < 0 ? '#ef4444' : 'linear-gradient(90deg, #c85a2e, #f5a97a)';

  let synLog = '';
  if (td.syns.length > 0) {
    synLog = `<div class="log-list">` + td.syns.map((s,i) => `
      <div class="log-item">
        <span class="log-item-name">${s.label}<span class="log-item-time">${s.time}</span></span>
        <div class="log-item-right">
          <span class="log-syn-val">${Number(s.value).toFixed(1)}</span>
          <button class="remove-btn" onclick="removeSyn(${i})">✕</button>
        </div>
      </div>`).join('') + `</div>`;
  }

  let resultsHtml = '';
  if (lookupResults.length > 0) {
    resultsHtml = `<div class="search-results">` + lookupResults.map((r, idx) => `
      <div class="search-result-item" onclick="selectLookup(${idx})">
        <div>
          <div class="search-result-name">${r.name}</div>
          <div class="search-result-note">${r.note}</div>
        </div>
        ${r.free ? `<span class="search-result-free">Free!</span>` : `<span class="search-result-syns">${r.syns} Syns</span>`}
      </div>`).join('') + `</div>`;
  } else if (currentSynLabel.length >= 2 && lookupResults.length === 0) {
    resultsHtml = `<div class="search-results"><div class="no-results">No matches found — enter Syns manually below</div></div>`;
  }

  let selectedHtml = '';
  if (selectedLookup) {
    const r = selectedLookup;
    if (r.free) {
      selectedHtml = `<div class="lookup-result free">
        <div class="lookup-header">
          <span class="lookup-food">${r.name}</span>
          <span class="lookup-value" style="color:#16a34a">Free!</span>
        </div>
        <div class="lookup-note">${r.note} <span class="badge badge-book">From your book</span></div>
        <button class="btn btn-green" onclick="addAsFreeFood()" style="margin-top:6px;padding:7px 14px;font-size:13px">Log as Free Food</button>
      </div>`;
    } else {
      selectedHtml = `<div class="lookup-result syns">
        <div class="lookup-header">
          <span class="lookup-food">${r.name}</span>
          <span class="lookup-value" style="color:#c85a2e">${r.syns} Syns</span>
        </div>
        <div class="lookup-note">${r.note} <span class="badge badge-book">From your book</span></div>
        <div class="adjust-row">
          <span>Adjust:</span>
          <input type="number" step="0.5" id="synValInput" value="${r.syns}" style="width:80px;padding:6px 10px" oninput="currentSynVal=this.value">
          <button class="btn" onclick="addSyn()" style="padding:7px 14px;font-size:13px">Add</button>
        </div>
      </div>`;
    }
  }

  let manualHtml = '';
  if (!selectedLookup) {
    manualHtml = `<div style="margin-top:10px">
      <div style="font-size:11px;color:#bba898;margin-bottom:6px">Or enter manually:</div>
      <div class="input-row">
        <input type="number" step="0.5" placeholder="Syns" id="manualSynVal" oninput="currentSynVal=this.value" style="flex:1">
        <button class="btn" onclick="addSynManual()">Add</button>
      </div>
    </div>`;
  }

  let mealLog = '';
  if (td.meals.length > 0) {
    const types = ['Breakfast','Lunch','Dinner','Snack','Free Food'];
    mealLog = types.map(type => {
      const group = td.meals.map((m,i) => ({...m,i})).filter(m => m.type === type);
      if (!group.length) return '';
      return `<div class="meal-section">
        <div class="section-label ${type==='Free Food'?'green':'orange'}">${type}</div>
        ${group.map(m => `<div class="log-item">
          <span class="log-item-name">${m.desc}<span class="log-item-time">${m.time}</span></span>
          <button class="remove-btn" onclick="removeMeal(${m.i})">✕</button>
        </div>`).join('')}
      </div>`;
    }).join('');
    mealLog = `<div style="margin-top:14px">${mealLog}</div>`;
  }

  document.getElementById('tab-today').innerHTML = `
    <div class="card">
      <div class="syn-count">
        <span class="card-label" style="margin-bottom:0">Daily Syns</span>
        <span class="syn-number" style="color:${synColor}">${totalSyns.toFixed(1)} / ${DAILY_SYNS}</span>
      </div>
      <div class="syn-bar-bg"><div class="syn-bar-fill" style="width:${pct}%;background:${barBg}"></div></div>
      <div class="syn-remaining" style="color:${synColor}">
        ${remaining < 0 ? Math.abs(remaining).toFixed(1)+' Syns over' : remaining.toFixed(1)+' Syns remaining'}
      </div>
    </div>

    <div class="card">
      <div class="card-label">Add Syns</div>
      <div class="card-sublabel">Search your Slimming World book data</div>
      <div class="input-row">
        <input type="text" id="synSearchInput" placeholder="e.g. Kit Kat, red wine, crisps..." value="${currentSynLabel}"
          oninput="handleSearch(this.value)" autocomplete="off" style="flex:1">
        ${selectedLookup ? `<button class="btn btn-grey" onclick="clearLookup()" style="padding:10px 12px;font-size:12px">Clear</button>` : ''}
      </div>
      ${resultsHtml}
      ${selectedHtml}
      ${manualHtml}
      ${synLog}
    </div>

    <div class="card">
      <div class="card-label">Healthy Extras</div>
      <div class="he-row">
        <button class="he-btn ${td.heA?'active':''}" onclick="toggleHE('heA')">
          <div class="he-icon">${td.heA?'✅':'⬜'}</div>
          <div class="he-label">HE A</div>
          <div class="he-desc">Calcium (milk, cheese)</div>
        </button>
        <button class="he-btn ${td.heB?'active':''}" onclick="toggleHE('heB')">
          <div class="he-icon">${td.heB?'✅':'⬜'}</div>
          <div class="he-label">HE B</div>
          <div class="he-desc">Fibre (bread, cereal)</div>
        </button>
      </div>
    </div>

    <div class="card">
      <div class="card-label">Food Diary</div>
      <div class="meal-types">
        ${['Breakfast','Lunch','Dinner','Snack'].map(t => `
          <button class="meal-type-btn ${currentMealType===t?'active':''}" onclick="setMealType('${t}')">${t}</button>
        `).join('')}
      </div>
      <div class="input-row">
        <input type="text" id="mealInput" placeholder="What did you eat?" style="flex:1"
          onkeydown="if(event.key==='Enter')addMeal()">
        <button class="btn" onclick="addMeal()">Add</button>
      </div>
      ${mealLog}
    </div>
  `;

  setTimeout(() => {
    const si = document.getElementById('synSearchInput');
    if (si && document.activeElement !== si) {
      // keep focus where it was
    }
  }, 0);
}

function renderHistory() {
  const data = getData();
  const today = getToday();
  const days = Object.entries(data)
    .filter(([k]) => k !== today)
    .sort((a,b) => b[0].localeCompare(a[0]))
    .slice(0, 14);

  if (days.length === 0) {
    document.getElementById('tab-history').innerHTML = `<div class="empty-state">No history yet. Start logging today!</div>`;
    return;
  }

  document.getElementById('tab-history').innerHTML = days.map(([date, d]) => {
    const syns = (d.syns||[]).reduce((a,s) => a + Number(s.value), 0);
    const over = syns > DAILY_SYNS;
    const meals = (d.meals||[]).map(m => m.desc).slice(0,4).join(', ') + ((d.meals||[]).length > 4 ? '...' : '');
    return `<div class="history-card ${over?'over':''}">
      <div class="history-header">
        <span class="history-date">${fmtDate(date)}</span>
        <span class="history-syns" style="color:${over?'#ef4444':'#22c55e'}">${syns.toFixed(1)} / ${DAILY_SYNS} Syns</span>
      </div>
      ${meals ? `<div class="history-meals">${meals}</div>` : ''}
      <div class="history-tags">
        ${d.heA ? `<span class="he-tag">HE A ✓</span>` : ''}
        ${d.heB ? `<span class="he-tag">HE B ✓</span>` : ''}
      </div>
    </div>`;
  }).join('');
}

function renderWeight() {
  const weights = getWeights();
  const weightLoss = weights.length >= 2 ? (weights[0].weight - weights[weights.length-1].weight).toFixed(1) : null;
  const banner = (weightLoss !== null) ? `
    <div class="weight-banner">
      <div class="weight-banner-label">Total Change</div>
      <div class="weight-banner-num">${weightLoss > 0 ? '-' : '+'}${Math.abs(weightLoss)}</div>
      <div class="weight-banner-sub">from ${weights[0].weight} to ${weights[weights.length-1].weight}</div>
    </div>` : '';

  const today = getToday();
  const logHtml = weights.length > 0 ? `
    <div class="card">
      <div class="card-label">Weight Log</div>
      ${[...weights].reverse().map((w, ri) => {
        const i = weights.length - 1 - ri;
        const prev = weights[i-1];
        const diff = prev ? (w.weight - prev.weight).toFixed(1) : null;
        return `<div class="weight-log-item">
          <div>
            <div class="weight-date">${fmtDate(w.date)}</div>
            ${diff !== null ? `<div class="weight-diff" style="color:${Number(diff)<=0?'#22c55e':'#ef4444'}">${Number(diff)<=0?'▼ '+Math.abs(diff):'▲ '+diff} from last</div>` : ''}
          </div>
          <div class="weight-right">
            <span class="weight-val">${w.weight}</span>
            <button class="remove-btn" onclick="editWeight(${i})" style="color:#c85a2e;font-size:14px">✏️</button>
            <button class="remove-btn" onclick="deleteWeight(${i})">✕</button>
          </div>
        </div>`;
      }).join('')}
    </div>` : '';

  const editLabel = editWeightIdx !== null ? 'Edit Weight' : 'Log Weight';
  const editVals = editWeightIdx !== null ? `value="${weights[editWeightIdx].weight}"` : '';
  const dateVal = editWeightIdx !== null ? weights[editWeightIdx].date : today;

  document.getElementById('tab-weight').innerHTML = `
    ${banner}
    <div class="card">
      <div class="card-label">${editLabel}</div>
      <input type="date" id="weightDate" value="${dateVal}" style="margin-bottom:8px">
      <div class="input-row">
        <input type="number" step="0.1" placeholder="e.g. 11.4 (stone)" id="weightVal" ${editVals} style="flex:1">
        <button class="btn" onclick="saveWeight()">${editWeightIdx !== null ? 'Save' : 'Log'}</button>
      </div>
      ${editWeightIdx !== null ? `<button class="btn btn-grey btn-full" onclick="cancelWeightEdit()">Cancel</button>` : ''}
    </div>
    ${logHtml}
  `;
}

// ============================================================
// ACTIONS
// ============================================================
function switchTab(t) { currentTab = t; render(); }

function handleSearch(val) {
  currentSynLabel = val;
  selectedLookup = null;
  lookupResults = val.length >= 2 ? searchSyns(val) : [];
  renderToday();
  // restore focus
  const el = document.getElementById('synSearchInput');
  if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
}

function selectLookup(idx) {
  selectedLookup = lookupResults[idx];
  currentSynVal = selectedLookup.syns > 0 ? String(selectedLookup.syns) : '';
  lookupResults = [];
  renderToday();
}

function clearLookup() {
  selectedLookup = null;
  currentSynLabel = '';
  currentSynVal = '';
  lookupResults = [];
  renderToday();
  const el = document.getElementById('synSearchInput');
  if (el) el.focus();
}

function addSyn() {
  const input = document.getElementById('synValInput');
  const val = parseFloat(input ? input.value : currentSynVal);
  if (isNaN(val) || val < 0 || !currentSynLabel) return;
  const td = getTodayData();
  td.syns.push({ label: currentSynLabel, value: val, time: new Date().toLocaleTimeString('en-GB', {hour:'2-digit',minute:'2-digit'}) });
  setTodayData(td);
  currentSynLabel = ''; currentSynVal = ''; selectedLookup = null; lookupResults = [];
  renderToday();
}

function addSynManual() {
  const input = document.getElementById('manualSynVal');
  const val = parseFloat(input ? input.value : currentSynVal);
  if (isNaN(val) || val < 0 || !currentSynLabel) return;
  const td = getTodayData();
  td.syns.push({ label: currentSynLabel, value: val, time: new Date().toLocaleTimeString('en-GB', {hour:'2-digit',minute:'2-digit'}) });
  setTodayData(td);
  currentSynLabel = ''; currentSynVal = ''; selectedLookup = null; lookupResults = [];
  renderToday();
}

function addAsFreeFood() {
  const td = getTodayData();
  td.meals.push({ type: 'Free Food', desc: currentSynLabel, time: new Date().toLocaleTimeString('en-GB', {hour:'2-digit',minute:'2-digit'}) });
  setTodayData(td);
  currentSynLabel = ''; currentSynVal = ''; selectedLookup = null; lookupResults = [];
  renderToday();
}

function removeSyn(i) {
  const td = getTodayData();
  td.syns.splice(i, 1);
  setTodayData(td);
  renderToday();
}

function setMealType(t) { currentMealType = t; renderToday(); }

function addMeal() {
  const input = document.getElementById('mealInput');
  if (!input || !input.value.trim()) return;
  const td = getTodayData();
  td.meals.push({ type: currentMealType, desc: input.value.trim(), time: new Date().toLocaleTimeString('en-GB', {hour:'2-digit',minute:'2-digit'}) });
  setTodayData(td);
  renderToday();
}

function removeMeal(i) {
  const td = getTodayData();
  td.meals.splice(i, 1);
  setTodayData(td);
  renderToday();
}

function toggleHE(which) {
  const td = getTodayData();
  td[which] = !td[which];
  setTodayData(td);
  renderToday();
}

function saveWeight() {
  const val = parseFloat(document.getElementById('weightVal').value);
  const date = document.getElementById('weightDate').value;
  if (isNaN(val) || !date) return;
  let weights = getWeights();
  if (editWeightIdx !== null) {
    weights[editWeightIdx] = { date, weight: val };
    editWeightIdx = null;
  } else {
    weights.push({ date, weight: val });
    weights.sort((a,b) => a.date.localeCompare(b.date));
  }
  saveWeights(weights);
  renderWeight();
}

function editWeight(i) { editWeightIdx = i; renderWeight(); }
function cancelWeightEdit() { editWeightIdx = null; renderWeight(); }
function deleteWeight(i) {
  let weights = getWeights();
  weights.splice(i, 1);
  saveWeights(weights);
  renderWeight();
}

// ============================================================
// INIT
// ============================================================
render();
</script>
</body>
</html>
