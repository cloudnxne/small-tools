            const secOpen=!coll['master_'+sec.id];
            const secDone=sec.items.filter(i=>isDone(i)).length;
            return <div className='hl-grp' key={sec.id}>
              <div className='hl-grph' onClick={()=>setColl(c=>({...c,['master_'+sec.id]:!c['master_'+sec.id]}))}>
                <span className='hl-grpl'>{sec.label}</span>
                <span className='hl-grpc'>{secDone}/{sec.items.length}</span>
                <span className={'hl-chev'+(secOpen?' open':'')}>▲</span>
              </div>
              {secOpen&&sec.items.map(item=>{
                const done=isDone(item);
                const isEditing=editingKey==='master_'+item.key;
                const{qty,name}=getDisplay(item.key,item.text);
                const isEditingQty=editingQtyKey==='master_'+item.key;
                const rawForCat=item.text;
                return <div key={item.key} className={'hl-si'+(done?' done':'')} style={isEditing?{flexDirection:'column',alignItems:'stretch',gap:6,padding:'10px 18px'}:{}}>
                  <div className='hl-cb' onClick={()=>!isEditing&&toggleMaster(item)}>{done?'✓':''}</div>
                  {isEditing
                    ?<>
                        <div className='hl-edit-row'>
                          <input className='hl-qty-input' placeholder='qty' value={editQty} onChange={e=>setEditQty(e.target.value)} style={{width:70}}/>
                          <input className='hl-inline-input' placeholder='item name' value={editName} onChange={e=>setEditName(e.target.value)}
                            onKeyDown={e=>{
                              if(e.key==='Enter'){
                                onShopEdit(item.key,{qty:editQty.trim(),name:editName.trim()});
                                if(editCat){const rk=editName.trim().toLowerCase().replace(/[^a-z0-9 ]/g,'').trim();if(rk)onCatOverride({...catOverrides,[rk]:editCat});}
                                setEditingKey(null);
                              }
                              if(e.key==='Escape')setEditingKey(null);
                            }} autoFocus/>
                          <button className='hl-inline-save' onClick={()=>{
                            onShopEdit(item.key,{qty:editQty.trim(),name:editName.trim()});
                            if(editCat){
                              // Use same key format as cat() function
                              const rk=editName.trim().toLowerCase().replace(/[^a-z0-9 ]/g,'').trim();
                              if(rk)onCatOverride({...catOverrides,[rk]:editCat});
                            }
                            setEditingKey(null);
                          }}>✓</button>
                          <button className='hl-editbtn' onClick={()=>setEditingKey(null)}>✕</button>
                        </div>
                        <div style={{display:'flex',alignItems:'center',gap:8}}>
                          <span style={{fontSize:10,color:'#9A8E7A',flexShrink:0}}>Aisle:</span>
                          <CatSelect value={editCat} onChange={setEditCat}/>
                        </div>
                      </>
                    :<>
                        {isEditingQty
                          ?<input className='hl-qty-input' value={qtyVal} autoFocus onChange={e=>setQtyVal(e.target.value)}
                              onBlur={()=>{onShopEdit(item.key,{qty:qtyVal.trim(),name});setEditingQtyKey(null);}}
                              onKeyDown={e=>{if(e.key==='Enter'){onShopEdit(item.key,{qty:qtyVal.trim(),name});setEditingQtyKey(null);}if(e.key==='Escape')setEditingQtyKey(null);}}/>
                          :<span className='hl-qty' onClick={()=>!done&&(setEditingQtyKey('master_'+item.key),setQtyVal(qty))}>{qty||'+'}</span>
                        }
                        <div style={{flex:1,cursor:'pointer'}} onClick={()=>toggleMaster(item)}>
                          <div className='hl-in' style={{display:'flex',alignItems:'center',gap:4,flexWrap:'wrap'}}>
                            {name}<SrcBadge src={item.src}/>
                            {item.batches>1&&<span style={{fontSize:9,background:'#FEF0E8',color:'#C4784A',borderRadius:4,padding:'0 5px',fontWeight:700}}>×{item.batches}</span>}
                          </div>
                          {item.recipes&&<div className='hl-src'>For: {item.recipes.join(', ')}</div>}
                        </div>
                        <button className='hl-editbtn' onClick={()=>{
                          const{qty:q,name:n}=getDisplay(item.key,item.text);
                          const curCat=catOverrides[rawForCat.toLowerCase().replace(/[^a-z0-9 ]/g,'').trim()]||'';
                          setEditQty(q);setEditName(n);setEditCat(curCat);setEditingKey('master_'+item.key);
                        }}>✏️</button>
                        <button className='hl-delbtn' title='Remove' onClick={(e)=>{e.stopPropagation();masterDelete(item);}}>✕</button>
                      </>
                  }
                </div>;
              })}
            </div>;
          })
        }
      <div className='hl-master-addrow'>
        <input className='hl-shop-addinput' type='text' placeholder='Add an item…' value={newMaster} onChange={e=>setNewMaster(e.target.value)} onKeyDown={e=>e.key==='Enter'&&addMasterItem()}/>
        <CatSelect value={newMasterCat} onChange={setNewMasterCat}/>
        <select className='hl-master-type' value={newMasterType} onChange={e=>setNewMasterType(e.target.value)}>
          <option value='adhoc'>Extra Item</option>
          <option value='ess'>Essential</option>
        </select>
        <button className='hl-shop-addbtn' onClick={addMasterItem}>+ Add</button>
      </div>
    </div>;
    })()}

    {activeTab==='meals'&&<div className='hl-scard'>
      <div className='hl-shead bg-gen'>🧾 Auto-generated from your meal plan</div>
      {plannedMeals.length>0&&<div className='hl-mchips'>{plannedMeals.map(m=><span key={m} className='hl-chip'>{m}</span>)}</div>}
      {grouped.length===0&&weekExtras.length===0
        ?<div className='hl-empty'>Select meals in the Meal Plan tab<br/>and ingredients appear here ✨</div>
        :<>
          {grouped.map(sec=>{
            const visibleItems=sec.items.filter(e=>{const k=e.item.toLowerCase().replace(/[^a-z0-9]/g,'_');return!weekRemoved[k];});
            const open=!coll[sec.id];
            return <div className='hl-grp' key={sec.id}>
              <div className='hl-grph' onClick={()=>setColl(c=>({...c,[sec.id]:!c[sec.id]}))}>
                <span className='hl-grpl'>{sec.label}</span>
                <span className='hl-grpc'>{visibleItems.length} item{visibleItems.length!==1?'s':''}</span>
                <span className={'hl-chev'+(open?' open':'')}>▲</span>
              </div>
              {open&&visibleItems.map(e=>{
                const k=e.item.toLowerCase().replace(/[^a-z0-9]/g,'_');
                const b=e.batches||1;
                return <ItemRow key={e.rawItem||e.item} itemKey={k} defaultText={e.item} rawText={e.rawItem||e.item} forRecipes={e.recipes} isManual={false} onDelete={()=>onShopRemove(k)} batchCount={b} fromPantry={e.fromPantry}/>;
              })}
            </div>;
          })}
          {weekExtras.length>0&&<div className='hl-grp'>
            <div className='hl-grph' onClick={()=>setColl(c=>({...c,'_extras':!c['_extras']}))}>
              <span className='hl-grpl'>🛒 Manually Added</span>
              <span className='hl-grpc'>{weekExtras.length} item{weekExtras.length!==1?'s':''}</span>
              <span className={'hl-chev'+(!coll['_extras']?' open':'')}>▲</span>
            </div>
            {!coll['_extras']&&weekExtras.map(item=>{
              const k='extra_'+item.id;
              return <ItemRow key={item.id} itemKey={k} defaultText={item.text} rawText={item.text} forRecipes={null} isManual={true} onDelete={()=>removeExtra(item.id)} label={item.carriedOver?'↩ carried over':null}/>;
            })}
          </div>}
          {removedCount>0&&<div className='hl-removed-bar'>
            <span>{removedCount} item{removedCount!==1?'s':''} hidden</span>
            <button className='hl-restore-btn' onClick={onShopRestore}>Restore all</button>
          </div>}
        </>
      }
      <div className='hl-shop-addrow'>
        <input className='hl-shop-addinput' type='text' placeholder='Add an item manually…' value={newExtra} onChange={e=>setNewExtra(e.target.value)} onKeyDown={e=>e.key==='Enter'&&addExtra()}/>
        <CatSelect value={newExtraCat} onChange={setNewExtraCat}/>
        <button className='hl-shop-addbtn' onClick={addExtra}>+ Add</button>
      </div>
    </div>}

    {activeTab==='adhoc'&&<div className='hl-scard'>
      <div className='hl-shead bg-adhoc' style={{justifyContent:'space-between',flexWrap:'wrap',gap:8}}>
        <span>🛍️ Extra Items</span>
        {adhocDoneCount>0&&<button onClick={clearDoneAdhoc} style={{background:'rgba(255,255,255,.2)',border:'none',color:'white',borderRadius:6,padding:'3px 10px',fontSize:11,cursor:'pointer',fontFamily:"'DM Sans',sans-serif",whiteSpace:'nowrap'}}>Remove ticked ({adhocDoneCount})</button>}
      </div>
      {weekAdhoc.length===0&&<div className='hl-empty'>One-off items not in your regular lists.<br/>Add below, tick off as you go, then remove when done.</div>}
      <div>
        {weekAdhoc.map(item=>{
          const k='adhoc_'+item.id;
          const done=adhocChecked[k];
          const isEditingThis=editingKey===k;
          return <div key={item.id} className={'hl-si'+(done?' done':'')+(isEditingThis?' ':'')} style={isEditingThis?{flexDirection:'column',alignItems:'stretch',gap:6,padding:'10px 18px'}:{}}>
            {isEditingThis
              ?<>
                  <div className='hl-edit-row'>
                    <input className='hl-inline-input' placeholder='item name' value={editName} onChange={e=>setEditName(e.target.value)}
                      onKeyDown={e=>{if(e.key==='Enter'){onCatOverride&&editCat&&onCatOverride({...catOverrides,[editName.toLowerCase().replace(/[^a-z0-9 ]/g,'').trim()]:editCat});setAdhoc({...adhoc,[viewKey]:weekAdhoc.map(i=>i.id===item.id?{...i,text:editName.trim()||i.text}:i)});setEditingKey(null);}if(e.key==='Escape')cancelEdit();}} autoFocus/>
                    <button className='hl-inline-save' onClick={()=>{if(editCat){const rk=editName.toLowerCase().replace(/[^a-z0-9 ]/g,'').trim();if(rk)onCatOverride({...catOverrides,[rk]:editCat});}setAdhoc({...adhoc,[viewKey]:weekAdhoc.map(i=>i.id===item.id?{...i,text:editName.trim()||i.text}:i)});setEditingKey(null);}}>✓</button>
                    <button className='hl-editbtn' onClick={cancelEdit}>✕</button>
                  </div>
                  <div style={{display:'flex',alignItems:'center',gap:8}}>
                    <span style={{fontSize:10,color:'#9A8E7A',flexShrink:0}}>Aisle:</span>
                    <CatSelect value={editCat} onChange={setEditCat}/>
                  </div>
                </>
              :<>
                  <div className='hl-cb' onClick={()=>onToggleAdhoc(k)}>{done?'✓':''}</div>
                  <div className='hl-in' onClick={()=>onToggleAdhoc(k)} style={{flex:1}}>{item.text}</div>
                  <button className='hl-editbtn' onClick={()=>{const curCat=catOverrides[item.text.toLowerCase().replace(/[^a-z0-9 ]/g,'').trim()]||'';setEditName(item.text);setEditCat(curCat);setEditingKey(k);}} title='Edit'>✏️</button>
                  <button className='hl-delbtn' onClick={()=>setAdhoc({...adhoc,[viewKey]:weekAdhoc.filter(i=>i.id!==item.id)})}>✕</button>
                </>
            }
          </div>;
        })}
      </div>
      <div className='hl-addrow'>
        <input className='hl-addinput' type='text' placeholder='e.g. Birthday candles, new sponge…' value={newAdhoc} onChange={e=>setNewAdhoc(e.target.value)} onKeyDown={e=>e.key==='Enter'&&addAdhoc()}/>
        <CatSelect value={newAdhocCat} onChange={setNewAdhocCat}/>
        <button className='hl-addbtn' style={{background:'#6A5A8A'}} onClick={addAdhoc}>+ Add</button>
      </div>
    </div>}

    {activeTab==='ess'&&<div className='hl-scard'>
      <div className='hl-shead bg-ess'>🔄 Repeat Essentials</div>
      <div>{essentials.map((item,i)=>{
        const k='ess_'+item.toLowerCase().replace(/[^a-z0-9]/g,'_');
        const done=essChecked[k];
        const isEditingThis=editingKey==='ess_'+i;
        return <div key={i} className={'hl-si'+(done?' done':'')} style={isEditingThis?{flexDirection:'column',alignItems:'stretch',gap:6,padding:'10px 18px'}:{}}>
          {isEditingThis
            ?<>
                <div className='hl-edit-row'>
                  <input className='hl-inline-input' placeholder='item name' value={editName} autoFocus
                    onChange={e=>setEditName(e.target.value)}
                    onKeyDown={e=>{
                      if(e.key==='Enter'){const t=editName.trim()||item;if(editCat){const rk=t.toLowerCase().replace(/[^a-z0-9 ]/g,'').trim();if(rk)onCatOverride({...catOverrides,[rk]:editCat});}setEssentials(essentials.map((x,j)=>j===i?t:x));setEditingKey(null);}
                      if(e.key==='Escape')cancelEdit();
                    }}/>
                  <button className='hl-inline-save' onClick={()=>{
                    const t=editName.trim()||item;
                    if(editCat){const rk=t.toLowerCase().replace(/[^a-z0-9 ]/g,'').trim();if(rk)onCatOverride({...catOverrides,[rk]:editCat});}
                    setEssentials(essentials.map((x,j)=>j===i?t:x));setEditingKey(null);
                  }}>✓</button>
                  <button className='hl-editbtn' onClick={cancelEdit}>✕</button>
                </div>
                <div style={{display:'flex',alignItems:'center',gap:8}}>
                  <span style={{fontSize:10,color:'#9A8E7A',flexShrink:0}}>Aisle:</span>
                  <CatSelect value={editCat} onChange={setEditCat}/>
                </div>
              </>
            :<>
                <div className='hl-cb' onClick={()=>onToggleEss(k)}>{done?'✓':''}</div>
                <div className='hl-in' onClick={()=>onToggleEss(k)} style={{flex:1}}>{item}</div>
                <button className='hl-editbtn' onClick={()=>{const curCat=catOverrides[item.toLowerCase().replace(/[^a-z0-9 ]/g,'').trim()]||'';setEditName(item);setEditCat(curCat);setEditingKey('ess_'+i);}} title='Edit'>✏️</button>
                <button className='hl-delbtn' onClick={()=>setEssentials(essentials.filter((_,j)=>j!==i))}>✕</button>
              </>
          }
        </div>;
      })}</div>
      <div className='hl-addrow'>
        <input className='hl-addinput' type='text' placeholder='Add a regular essential…' value={newEss} onChange={e=>setNewEss(e.target.value)} onKeyDown={e=>e.key==='Enter'&&addEss()}/>
        <CatSelect value={newEssCat} onChange={setNewEssCat}/>
        <button className='hl-addbtn' onClick={addEss}>+ Add</button>
      </div>
    </div>}
  </div>;
}

/* ── NUTRITION TAB ───────────────────────────────────────── */
function NutritionTab({plan,allRecipes}){
  const getNut=n=>(!n||SKIP_RECIPE.includes(n))?null:allRecipes.find(r=>r.name===n)?.nutrition||null;
  const addN=(a,b)=>{if(!a&&!b)return null;const r=a||{kcal:0,protein:0,carbs:0,fat:0,fibre:0},s=b||{kcal:0,protein:0,carbs:0,fat:0,fibre:0};return{kcal:r.kcal+s.kcal,protein:r.protein+s.protein,carbs:r.carbs+s.carbs,fat:r.fat+s.fat,fibre:r.fibre+s.fibre};};
  const days=DAYS.map(day=>{const d=plan[day];const dn=getNut(d.dinner),an=getNut(d.alex),gn=getNut(d.sam);return{day,dinner:d.dinner,alex:d.alex,sam:d.sam,dn,an,gn,aT:addN(dn,an),gT:addN(dn,gn)};});
  const planned=days.filter(d=>d.dinner||d.alex||d.sam);
  const withN=days.filter(d=>d.aT);
  const avg=useMemo(()=>{
    if(!withN.length)return null;
    const tot=withN.reduce((a,d)=>addN(a,d.aT),{kcal:0,protein:0,carbs:0,fat:0,fibre:0});
    return{kcal:Math.round(tot.kcal/withN.length),protein:Math.round(tot.protein/withN.length),carbs:Math.round(tot.carbs/withN.length),fat:Math.round(tot.fat/withN.length),fibre:Math.round(tot.fibre/withN.length)};
  },[withN.length]);
  if(!planned.length)return <div><h1 className='hl-h1'>Nutrition</h1><p className='hl-sub'>Plan your meals to see nutrition data</p><div style={{textAlign:'center',padding:'40px',fontFamily:"'Lora',serif",fontStyle:'italic',color:'#9A8E7A'}}>Add meals in the Meal Plan tab 🥗</div></div>;
  return <div>

}

/* ── BACKUP MODAL ────────────────────────────────────────── */
function BackupModal({onClose}){
  const[msg,setMsg]=useState(null);
  const[busy,setBusy]=useState(false);
  const fileRef=useRef(null);

  const download=async()=>{
    setBusy(true);setMsg(null);
    try{
      const res=await fetch(API+'?t='+Date.now());
      if(!res.ok)throw new Error('Could not fetch data');
      const data=await res.json();
      const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
      const url=URL.createObjectURL(blob);
      const a=document.createElement('a');
      const d=new Date();
      a.href=url;
      a.download=`homelife-backup-${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}.json`;
      a.click();
      URL.revokeObjectURL(url);
      setMsg({type:'ok',text:'Backup downloaded successfully ✓'});
    }catch(e){setMsg({type:'err',text:'Download failed: '+e.message});}
    setBusy(false);
  };

  const restore=async(e)=>{
    const file=e.target.files[0];
    if(!file)return;
    setBusy(true);setMsg(null);
    try{
      const text=await file.text();
      const data=JSON.parse(text);
      // Basic validation — must have at least one known key
      if(!data.plans&&!data.customRecipes&&!data.essentials)
        throw new Error('This does not look like a valid Home Life backup file.');
      const res=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});
      if(!res.ok)throw new Error('Server rejected the file');
      setMsg({type:'ok',text:'Backup restored ✓ — refresh the page to see your data.'});
    }catch(e){setMsg({type:'err',text:'Restore failed: '+e.message});}
    setBusy(false);
    // Reset file input so same file can be re-selected if needed
    if(fileRef.current)fileRef.current.value='';
  };

  return(
    <div className='hl-ov' onClick={e=>{if(e.target===e.currentTarget)onClose();}}>
      <div className='hl-bkmodal'>
        <div className='hl-bkmodal-hdr'>
          <h2>💾 Backup & Restore</h2>
          <button className='hl-close' onClick={onClose}>✕</button>
        </div>
        <div className='hl-bkmodal-body'>
          {msg&&<div className={`hl-bk-msg ${msg.type==='ok'?'hl-bk-ok':'hl-bk-err'}`}>{msg.text}</div>}

          <div className='hl-bk-row'>
            <h3>⬇️ Download Backup</h3>
            <p>Saves everything — meal plans, recipes, shopping lists, essentials — as a JSON file to your device. Do this regularly to keep a safe copy.</p>
            <button className='hl-bk-btn hl-bk-dl' onClick={download} disabled={busy}>
              {busy?'Downloading…':'Download backup'}
            </button>
          </div>

          <div className='hl-bk-row'>
            <h3>⬆️ Restore from Backup</h3>
            <p>Upload a previously downloaded backup file to restore your data. This will overwrite everything currently on the server.</p>
            <input ref={fileRef} type='file' accept='.json' style={{display:'none'}} onChange={restore}/>
            <button className='hl-bk-btn hl-bk-up' onClick={()=>fileRef.current?.click()} disabled={busy}>
              {busy?'Restoring…':'Choose backup file…'}
            </button>
          </div>

          <div style={{fontSize:11,fontFamily:"'Lora',serif",fontStyle:'italic',color:'#B0A490',lineHeight:1.6,paddingTop:4}}>
            Tip: your backup file is named with today's date so you can keep multiple versions. Store them in Google Drive or iCloud for safekeeping.
          </div>
        </div>
      </div>
    </div>
  );
}

const UNITS=['','g','kg','ml','l','tsp','tbsp','cup','oz','lb','can','bag','bunch','clove','rasher','slice'];

function PantryTab({pantry,onSave,plan,allRecipes,viewKey}){
  const[newName,setNewName]=useState('');
  const[newAmt,setNewAmt]=useState('');
  const[newUnit,setNewUnit]=useState('');
  const[editKey,setEditKey]=useState(null);
  const[editAmt,setEditAmt]=useState('');
  const[editUnit,setEditUnit]=useState('');
  const[showUseModal,setShowUseModal]=useState(false);
  const[usePreview,setUsePreview]=useState([]);

  const items=Object.entries(pantry).sort((a,b)=>a[1].name.localeCompare(b[1].name));

  const grouped=SECTIONS.map(s=>({
    ...s,
    items:items.filter(([k,v])=>(v.category||cat(v.name))===s.id)
  })).filter(s=>s.items.length>0);

  // Items with no recognised section
  const uncategorised=items.filter(([k,v])=>!SECTIONS.some(s=>s.id===(v.category||cat(v.name))));

  const addItem=()=>{
    const name=newName.trim();if(!name)return;
    const key=pantryKey(name);
    const amount=parseFloat(newAmt)||0;
    const unit=newUnit;
    const category=cat(name);
    const updated={...pantry,[key]:{name,amount,unit,category}};
    onSave(updated);
    setNewName('');setNewAmt('');setNewUnit('');
  };

  const removeItem=(key)=>{
    const updated={...pantry};delete updated[key];onSave(updated);
  };

  const saveEdit=(key)=>{
    const item=pantry[key];
    const updated={...pantry,[key]:{...item,amount:parseFloat(editAmt)||0,unit:editUnit}};
    onSave(updated);setEditKey(null);
  };

  // Build preview of what this week's recipes will use from pantry
  const buildUsePreview=()=>{
    const changes=[];
    const bulkCookList=plan.bulkCook||[];
    const skipList=plan.skipShopping||[];
    const recipeUse={};
    DAYS.forEach(day=>{
      const dp=plan[day];if(!dp)return;
      [['dinner',2],['alex',1],['sam',1]].forEach(([slot,count])=>{
        const name=dp[slot];
        if(!name||SKIP_RECIPE.includes(name))return;
        if(skipList.includes(day+'_'+slot))return;
        const rec=allRecipes.find(r=>r.name===name);
        if(!rec)return;
        const batches=bulkCookList.includes(name)?1:Math.max(1,Math.ceil(count/(rec.serves||1)));
        rec.ingredients?.forEach(ing=>{
          const parsed=parseIngredient(ing);
          const key=pantryKey(parsed.baseName||ing);
          if(!recipeUse[key])recipeUse[key]={key,name:ing,amount:0,unit:parsed.unit};
          recipeUse[key].amount+=parsed.amount*(batches||1);
        });
      });
    });
    Object.values(recipeUse).forEach(use=>{
      const have=pantry[use.key];
      if(!have)return;
      const haveBase=toBase(have.amount,have.unit||'');
      const useBase=toBase(use.amount,use.unit||'');
      if(haveBase.unit!==useBase.unit&&haveBase.unit!==''&&useBase.unit!=='')return;
      const deduct=Math.min(haveBase.amount,useBase.amount);
      const newAmt=Math.max(0,haveBase.amount-deduct);
      // Convert back
      let displayAmt=newAmt;
      let displayUnit=have.unit;
      if(have.unit==='g'&&newAmt>=1000){displayAmt=newAmt/1000;displayUnit='kg';}
      if(have.unit==='ml'&&newAmt>=1000){displayAmt=newAmt/1000;displayUnit='l';}
      changes.push({key:use.key,name:have.name,from:have.amount,fromUnit:have.unit,to:parseFloat(displayAmt.toFixed(2)),toUnit:displayUnit,used:deduct,ingName:use.name});
    });
    setUsePreview(changes);
    setShowUseModal(true);
  };

  const confirmUse=()=>{
    const updated={...pantry};
    usePreview.forEach(({key,to,toUnit})=>{
      if(updated[key]){
        updated[key]={...updated[key],amount:to,unit:toUnit};
      }
    });
    onSave(updated);
    setShowUseModal(false);
  };

  const fmtAmt=(amount,unit)=>{
    if(!amount&&amount!==0)return '?';
    const n=parseFloat(amount.toFixed(2));
    return n+(unit?` ${unit}`:'');
  };

  function ItemRow({k,v}){
    const isEditing=editKey===k;
    const low=v.amount>0&&v.amount<=2&&!['g','kg','ml','l'].includes(v.unit);
    const empty=v.amount===0||v.amount===null||v.amount===undefined;
    return <div className='hl-pantry-item'>
      {isEditing
        ?<>
            <input className='hl-pantry-num' type='number' min='0' step='0.1' value={editAmt} onChange={e=>setEditAmt(e.target.value)} autoFocus onKeyDown={e=>{if(e.key==='Enter')saveEdit(k);if(e.key==='Escape')setEditKey(null);}}/>
            <select className='hl-pantry-unit' value={editUnit} onChange={e=>setEditUnit(e.target.value)}>
              {UNITS.map(u=><option key={u} value={u}>{u||'count'}</option>)}
            </select>
            <button className='hl-inline-save' onClick={()=>saveEdit(k)}>✓</button>
            <button className='hl-editbtn' onClick={()=>setEditKey(null)}>✕</button>
          </>
        :<>
            <span className={'hl-pantry-amt'+(empty?' empty':low?' low':'')} onClick={()=>{setEditKey(k);setEditAmt(String(v.amount||0));setEditUnit(v.unit||'');}}>
              {empty?'Out':fmtAmt(v.amount,v.unit)}
            </span>
            <span className='hl-pantry-name'>{v.name}</span>
            <button className='hl-editbtn' onClick={()=>{setEditKey(k);setEditAmt(String(v.amount||0));setEditUnit(v.unit||'');}} title='Edit'>✏️</button>
            <button className='hl-delbtn' onClick={()=>removeItem(k)}>✕</button>
          </>
      }
    </div>;
  }

  return <div>
    <div className='hl-row'>
      <div>
        <h1 className='hl-h1'>🧊 Fridge & Pantry</h1>
        <p className='hl-sub'>Track what you have — ingredients are skipped from the shopping list if you have enough</p>
      </div>
      <button className='hl-week-use-btn' onClick={buildUsePreview} title="Deduct this week's recipe ingredients from your stock">
        ✅ Use this week's recipes
      </button>
    </div>

    {/* Add item */}
    <div style={{background:'white',borderRadius:14,padding:'14px 16px',marginBottom:16,boxShadow:'0 2px 12px rgba(42,74,30,.07)',display:'flex',gap:8,flexWrap:'wrap',alignItems:'center'}}>
      <input className='hl-pantry-input' placeholder='Item name (e.g. Onions, Chicken breast, Cheddar…)' value={newName} onChange={e=>setNewName(e.target.value)} onKeyDown={e=>e.key==='Enter'&&addItem()}/>
      <input className='hl-pantry-num' type='number' min='0' step='0.1' placeholder='Qty' value={newAmt} onChange={e=>setNewAmt(e.target.value)} onKeyDown={e=>e.key==='Enter'&&addItem()}/>
      <select className='hl-pantry-unit' value={newUnit} onChange={e=>setNewUnit(e.target.value)}>
        {UNITS.map(u=><option key={u} value={u}>{u||'count'}</option>)}
      </select>
      <button className='hl-addbtn' onClick={addItem} style={{background:'#2A4A1E',padding:'6px 14px',fontSize:12}}>+ Add to pantry</button>
    </div>

    {items.length===0
      ?<div style={{textAlign:'center',padding:'48px 24px',fontFamily:"'Lora',serif",fontStyle:'italic',color:'#9A8E7A',background:'white',borderRadius:16,boxShadow:'0 2px 12px rgba(42,74,30,.07)'}}>
          Add what you have in your fridge and cupboards.<br/>The shopping list will automatically skip things you already have enough of.
        </div>
      :<div className='hl-pantry-grid'>
          {[...grouped,...(uncategorised.length>0?[{id:'other',label:'🛒 Other',items:uncategorised}]:[])].map(sec=>(
            <div key={sec.id} className='hl-pantry-card'>
              <div className='hl-pantry-ch'><h3>{sec.label}</h3><span style={{fontSize:10,color:'#8CAD78'}}>{sec.items.length}</span></div>
              {sec.items.map(([k,v])=><ItemRow key={k} k={k} v={v}/>)}
            </div>
          ))}
        </div>
    }

    {/* Use this week modal */}
    {showUseModal&&ReactDOM.createPortal(
      <div className='hl-ov' onClick={e=>{if(e.target===e.currentTarget)setShowUseModal(false);}}>
        <div className='hl-modal' style={{maxWidth:480}}>
          <div className='hl-mhdr'><h2>Use this week's recipes</h2><button className='hl-close' onClick={()=>setShowUseModal(false)}>✕</button></div>
          <div style={{padding:'16px 20px',maxHeight:'60vh',overflowY:'auto'}}>
            {usePreview.length===0
              ?<p style={{fontFamily:"'Lora',serif",fontStyle:'italic',color:'#9A8E7A',textAlign:'center',padding:'20px 0'}}>None of this week's recipe ingredients are tracked in your pantry yet.</p>
              :<>
                  <p style={{fontFamily:"'DM Sans',sans-serif",fontSize:12,color:'#7A6B52',marginBottom:12}}>These pantry quantities will be deducted based on this week's meal plan:</p>
                  {usePreview.map(({key,name,from,fromUnit,to,toUnit,ingName})=>(
                    <div key={key} style={{display:'flex',alignItems:'center',gap:10,padding:'8px 0',borderBottom:'1px solid #F0EBE0',fontFamily:"'DM Sans',sans-serif",fontSize:12}}>
                      <span style={{flex:1,color:'#2C2416'}}>{name}</span>
                      <span style={{color:'#9A8E7A',textDecoration:'line-through'}}>{fmtAmt(from,fromUnit)}</span>
                      <span style={{color:'#2A4A1E',fontWeight:600}}>→ {to===0?'Empty':fmtAmt(to,toUnit)}</span>
                    </div>
                  ))}
                </>
            }
          </div>
          <div style={{padding:'12px 20px',borderTop:'1px solid #F0EBE0',display:'flex',gap:10,justifyContent:'flex-end'}}>
            <button className='hl-clr' onClick={()=>setShowUseModal(false)}>Cancel</button>
            {usePreview.length>0&&<button className='hl-week-use-btn' onClick={confirmUse}>Confirm &amp; deduct</button>}
          </div>
        </div>
      </div>,
      document.body
    )}
  </div>;
}

function App(){
  const[tab,setTab]=useState('plan');
  const[showBackup,setShowBackup]=useState(false);
  const[viewKey,setViewKey]=useState(getWeekKey(0));
  const[syncStatus,setSyncStatus]=useState('loading'); // loading | saved | saving | error
  const[loadError,setLoadError]=useState(null);
  const[stepsRec,setStepsRec]=useState(null);

  // Synced state
  const[allPlans,setAllPlans]=useState({});
  const[customRecipes,setCustomRecipes]=useState([]);
  const[overrides,setOverrides]=useState({});
  const[deletedRecipes,setDeletedRecipes]=useState([]); // names of deleted built-ins
  const[essentials,setEssentials]=useState(DEF_ESS);
  const[shopChecked,setShopChecked]=useState({}); // { weekKey: { ingredientKey: bool } }
  const[shopEdits,setShopEdits]=useState({});     // { weekKey: { itemKey: {qty,name} } }
  const[shopExtras,setShopExtrasState]=useState({}); // { weekKey: [{ id, text }] }
  const[shopRemoved,setShopRemovedState]=useState({}); // { weekKey: { itemKey: true } }
  const[catOverrides,setCatOverridesState]=useState({}); // { ingredientKey: sectionId }
  const[pantry,setPantryState]=useState({}); // { pantryKey: { name, amount, unit, category } }
  const[essChecked,setEssChecked]=useState({});   // { itemKey: bool }
  const[adhoc,setAdhocState]=useState({});         // { weekKey: [{ id, text }] }
  const[adhocChecked,setAdhocChecked]=useState({}); // { 'adhoc_id': bool }

  const saveTimer=useRef(null);
  const latestData=useRef({});
  const latestPending=useRef({});

  // Build snapshot of everything to save
  const snapshot=useCallback(()=>({
    plans:allPlans,customRecipes,overrides,essentials,shopChecked,essChecked
  }),[allPlans,customRecipes,overrides,essentials,shopChecked,essChecked]);

  // Debounced save to server
  const scheduleSave=useCallback((changedKey,changedVal)=>{
    setSyncStatus('saving');
    if(saveTimer.current)clearTimeout(saveTimer.current);
    // Store the pending change so if multiple rapid changes come in we send the latest
    latestPending.current={...latestPending.current,[changedKey]:changedVal};
    saveTimer.current=setTimeout(async()=>{
      try{
        // Always fetch the freshest server state first, then merge our changes on top.
        // This means if another device saved while we were working, we keep their changes
        // and only overwrite the specific fields we actually changed.
        const getRes=await fetch(API+'?t='+Date.now());
        const serverData=getRes.ok?await getRes.json():{};
        const merged={
          plans:serverData.plans||{},
          customRecipes:serverData.customRecipes||[],
          overrides:serverData.overrides||{},
          deletedRecipes:serverData.deletedRecipes||[],
          essentials:serverData.essentials||DEF_ESS,
          shopChecked:serverData.shopChecked||{},
          shopEdits:serverData.shopEdits||{},
          shopExtras:serverData.shopExtras||{},
          shopRemoved:serverData.shopRemoved||{},
          catOverrides:serverData.catOverrides||{},
          essChecked:serverData.essChecked||{},
          adhoc:serverData.adhoc||{},
          adhocChecked:serverData.adhocChecked||{},
          ...latestPending.current, // our changes win for fields we actually touched
        };
        latestPending.current={};
        const postRes=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(merged)});
        if(!postRes.ok)throw new Error('save failed');
        setSyncStatus('saved');
      }catch(e){
        setSyncStatus('error');
      }
    },300);
  },[]);

  // Load from server on mount
  useEffect(()=>{
    (async()=>{
      try{
        const res=await fetch(API+'?t='+Date.now());
        if(!res.ok)throw new Error('load failed');
        const d=await res.json();
        if(d.plans)setAllPlans(migratePlans(d.plans));
        if(d.customRecipes)setCustomRecipes(d.customRecipes);
        if(d.overrides)setOverrides(d.overrides);
        if(d.deletedRecipes)setDeletedRecipes(d.deletedRecipes);
        if(d.essentials)setEssentials(d.essentials);
        if(d.shopChecked)setShopChecked(d.shopChecked);
        if(d.shopEdits)setShopEdits(d.shopEdits);
        if(d.shopExtras)setShopExtrasState(d.shopExtras);
        if(d.shopRemoved)setShopRemovedState(d.shopRemoved);
        if(d.catOverrides)setCatOverridesState(d.catOverrides);
        if(d.pantry)setPantryState(d.pantry);
        if(d.essChecked)setEssChecked(d.essChecked);
        if(d.adhoc)setAdhocState(Array.isArray(d.adhoc)?{}:d.adhoc); // migrate old array to week-keyed object
        if(d.adhocChecked)setAdhocChecked(d.adhocChecked);
        setSyncStatus('saved');
      }catch(e){
        setSyncStatus('error');
        setLoadError('Could not connect to server. Check homelife-data.php is uploaded and the folder is writable.');
      }
    })();
  },[]);

  // Re-fetch when tab regains focus (picks up changes from other devices)
  useEffect(()=>{
    const onFocus=async()=>{
      try{
        const res=await fetch(API+'?t='+Date.now());
        if(!res.ok)return;
        const d=await res.json();
        if(d.plans)setAllPlans(migratePlans(d.plans));
        if(d.customRecipes)setCustomRecipes(d.customRecipes);
        if(d.overrides)setOverrides(d.overrides);
        if(d.deletedRecipes)setDeletedRecipes(d.deletedRecipes);
        if(d.essentials)setEssentials(d.essentials);
        if(d.shopChecked)setShopChecked(d.shopChecked);
        if(d.shopEdits)setShopEdits(d.shopEdits);
        if(d.shopExtras)setShopExtrasState(d.shopExtras);
        if(d.shopRemoved)setShopRemovedState(d.shopRemoved);
        if(d.catOverrides)setCatOverridesState(d.catOverrides);
        if(d.pantry)setPantryState(d.pantry);
        if(d.essChecked)setEssChecked(d.essChecked);
        if(d.adhoc)setAdhocState(Array.isArray(d.adhoc)?{}:d.adhoc); // migrate old array to week-keyed object
        if(d.adhocChecked)setAdhocChecked(d.adhocChecked);
        setSyncStatus('saved');
      }catch(e){}
    };
    window.addEventListener('focus',onFocus);
    // Also re-fetch when page becomes visible (handles mobile app switching)
    const onVisible=()=>{ if(document.visibilityState==='visible') onFocus(); };
    document.addEventListener('visibilitychange',onVisible);
    return()=>{
      window.removeEventListener('focus',onFocus);
      document.removeEventListener('visibilitychange',onVisible);
    };
  },[]);

  // Flush any pending debounced save immediately when page is hidden (user switches app/tab)
  useEffect(()=>{
    const onHide=()=>{
      if(document.visibilityState==='hidden'&&saveTimer.current){
        clearTimeout(saveTimer.current);
        saveTimer.current=null;
        // Fire the save immediately using the pending data
        const pending=latestPending.current;
        if(Object.keys(pending).length===0)return;
        latestPending.current={};
        (async()=>{
          try{
            const getRes=await fetch(API+'?t='+Date.now());
            const serverData=getRes.ok?await getRes.json():{};
            const merged={
              plans:serverData.plans||{},
              customRecipes:serverData.customRecipes||[],
              overrides:serverData.overrides||{},
              deletedRecipes:serverData.deletedRecipes||[],
              essentials:serverData.essentials||DEF_ESS,
              shopChecked:serverData.shopChecked||{},
              shopEdits:serverData.shopEdits||{},
              shopExtras:serverData.shopExtras||{},
              shopRemoved:serverData.shopRemoved||{},
              catOverrides:serverData.catOverrides||{},
              essChecked:serverData.essChecked||{},
              adhoc:serverData.adhoc||{},
              adhocChecked:serverData.adhocChecked||{},
              ...pending,
            };
            await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(merged)});
          }catch(e){}
        })();
      }
    };
    document.addEventListener('visibilitychange',onHide);
    return()=>document.removeEventListener('visibilitychange',onHide);
  },[]);

  // Track latest data ref for save
  useEffect(()=>{
    latestData.current={allPlans,customRecipes,overrides,essentials,shopChecked,essChecked};
  },[allPlans,customRecipes,overrides,essentials,shopChecked,essChecked]);

  // Setters that also trigger save
  const setAndSave=(setter,key)=>(val)=>{
    setter(val);
    // We need a tiny timeout to get the new value merged
    setTimeout(()=>scheduleSave({...latestData.current,[key]:typeof val==='function'?val(latestData.current[key]):val}),0);
  };

  const plan=allPlans[viewKey]||{...DEF_PLAN};

  const setPlan=(p)=>{
    const val=typeof p==='function'?p(allPlans[viewKey]||{...DEF_PLAN}):p;
    const updated={...allPlans,[viewKey]:val};
    setAllPlans(updated);
    scheduleSave('plans',updated);
  };

  const saveCustomRecipes=(val)=>{setCustomRecipes(val);scheduleSave('customRecipes',val);};
  const saveOverrides=(val)=>{setOverrides(val);scheduleSave('overrides',val);};
  const saveEssentials=(val)=>{setEssentials(val);scheduleSave('essentials',val);};
  const saveAdhoc=(val)=>{setAdhocState(val);scheduleSave('adhoc',val);};
  const saveShopExtras=(val)=>{setShopExtrasState(val);scheduleSave('shopExtras',val);};
  const saveShopRemoved=(val)=>{setShopRemovedState(val);scheduleSave('shopRemoved',val);};
  const saveCatOverrides=(val)=>{setCatOverridesState(val);scheduleSave('catOverrides',val);};
  const savePantry=(val)=>{setPantryState(val);scheduleSave('pantry',val);};

  const onToggleShop=(k)=>{
    const updated={...shopChecked,[viewKey]:{...(shopChecked[viewKey]||{}),[k]:!(shopChecked[viewKey]?.[k])}};
    setShopChecked(updated);scheduleSave('shopChecked',updated);
  };
  const onToggleEss=(k)=>{
    const updated={...essChecked,[k]:!essChecked[k]};
    setEssChecked(updated);scheduleSave('essChecked',updated);
  };
  const onToggleAdhoc=(k)=>{
    const updated={...adhocChecked,[k]:!adhocChecked[k]};
    setAdhocChecked(updated);scheduleSave('adhocChecked',updated);
  };
  const onShopEdit=(k,val)=>{
    const weekEdits=shopEdits[viewKey]||{};
    const updatedWeek=val===null
      ?Object.fromEntries(Object.entries(weekEdits).filter(([ek])=>ek!==k))
      :{...weekEdits,[k]:val};
    const updated={...shopEdits,[viewKey]:updatedWeek};
    setShopEdits(updated);scheduleSave('shopEdits',updated);
  };
  const onShopRemove=(k)=>{
    const updated={...shopRemoved,[viewKey]:{...(shopRemoved[viewKey]||{}),[k]:true}};
    saveShopRemoved(updated);
  };
  const onShopRestore=()=>{
    const updated={...shopRemoved,[viewKey]:{}};
    saveShopRemoved(updated);
  };

  const allRecipes=useMemo(()=>{
    const base=BUILT_IN
      .filter(r=>!deletedRecipes.includes(r.name))
      .map(r=>overrides[r.name]?{...r,...overrides[r.name]}:r);
    return[...base,...customRecipes];
  },[overrides,customRecipes,deletedRecipes]);

  const saveRecipe=(r)=>{
    const isBuiltIn=BUILT_IN.some(b=>b.name===r.name);
    if(isBuiltIn){const no={...overrides,[r.name]:r};saveOverrides(no);}
    else{const nc=customRecipes.map(c=>c.name===r.name?r:c);saveCustomRecipes(nc);}
  };
  const addRecipe=(r)=>{const nc=[...customRecipes,r];saveCustomRecipes(nc);};
  const delRecipe=(name)=>{
    const isBuiltIn=BUILT_IN.some(b=>b.name===name);
    if(isBuiltIn){
      const nd=[...deletedRecipes,name];
      setDeletedRecipes(nd);scheduleSave('deletedRecipes',nd);
    } else {
      const nc=customRecipes.filter(r=>r.name!==name);saveCustomRecipes(nc);
    }
  };
  const restoreRecipe=(name)=>{
    const nd=deletedRecipes.filter(n=>n!==name);
    setDeletedRecipes(nd);scheduleSave('deletedRecipes',nd);
  };

  const weekKeys=WEEK_OFFSETS.map(o=>getWeekKey(o));
  const curIdx=weekKeys.indexOf(viewKey);

  // When navigating forward, carry unticked items from previous week into next week's extras
  const navigateWeek=(newKey)=>{
    const newIdx=weekKeys.indexOf(newKey);
    if(newIdx>curIdx){
      const prevShopChecked=shopChecked[viewKey]||{};
      const prevEdits=shopEdits[viewKey]||{};
      const prevExtras=shopExtras[viewKey]||[];
      const nextExtras=shopExtras[newKey]||[];
      const carryItems=[];
      const alreadyIn=(text)=>nextExtras.some(e=>e.text===text)||carryItems.some(e=>e.text===text);

      // Carry extras that were explicitly left unticked
      prevExtras.forEach(item=>{
        const k='extra_'+item.id;
        if(prevShopChecked[k]===false){
          const editedName=prevEdits[k]?.name||item.text;
          if(!alreadyIn(editedName))
            carryItems.push({id:Date.now()+Math.random(),text:editedName,carriedOver:true});
        }
      });

      if(carryItems.length>0){
        const updated={...shopExtras,[newKey]:[...nextExtras,...carryItems]};
        saveShopExtras(updated);
      }

      // Reset all essential ticks so they start unticked for the new week
      setEssChecked({});
      scheduleSave('essChecked',{});
    }
    setViewKey(newKey);
  };

  const syncLabels={saved:['Synced ✓','sync-saved'],saving:['Saving…','sync-saving'],error:['Sync error','sync-error'],loading:['Connecting…','sync-loading']};
  const[syncTxt,syncCls]=syncLabels[syncStatus]||syncLabels.saved;

  const navTabs=[{id:'plan',label:'🍽 Meal Plan'},{id:'recipes',label:'📖 Recipes'},{id:'shopping',label:'🛒 Shopping'},{id:'nutrition',label:'📊 Nutrition'},{id:'pantry',label:'🧊 Pantry'}];

  if(syncStatus==='loading')return <div className='hl'><div className='hl-hdr'><div className='hl-top'><div><div className='hl-logo'>Home <em>Life</em></div></div></div><div className='hl-nav'/></div><div className='hl-loading'><div className='hl-loading-spinner'/><div className='hl-loading-txt'>Loading your family data…</div></div></div>;

  return <>
    {stepsRec&&<StepsModal recipe={stepsRec} onClose={()=>setStepsRec(null)}/>}
    {showBackup&&<BackupModal onClose={()=>setShowBackup(false)}/>}
    <div className='hl'>
      <div className='hl-hdr'>
        <div className='hl-top'>
          <div><div className='hl-logo'>Home <em>Life</em></div><div className='hl-tag'>meals · recipes · shopping · nutrition</div></div>
          <div style={{display:'flex',alignItems:'center',gap:10,flexWrap:'wrap'}}>
            <button className='hl-backup-btn' onClick={()=>setShowBackup(true)}>💾 Backup</button>
            <div className={`hl-sync ${syncCls}`}><div className='hl-sync-dot'/><span className='hl-sync-txt'>{syncTxt}</span></div>
            <div className='hl-wk'>
              <button className='hl-wkarr' onClick={()=>navigateWeek(weekKeys[curIdx-1])} disabled={curIdx<=0}>◀</button>
              <div className='hl-wkinfo'>
                <div className='hl-wklbl'>{keyToRelLabel(viewKey)}</div>
                <div className='hl-wkdate'>{keyToLabel(viewKey)}</div>
                <div className='hl-wkdots'>{weekKeys.map(k=><div key={k} className={'hl-wkdot'+(k===viewKey?' cur':allPlans[k]?' has':'')} onClick={()=>navigateWeek(k)} title={keyToRelLabel(k)}/>)}</div>
              </div>
              <button className='hl-wkarr' onClick={()=>navigateWeek(weekKeys[curIdx+1])} disabled={curIdx>=weekKeys.length-1}>▶</button>
            </div>
          </div>
        </div>
        <div className='hl-nav'>{navTabs.map(t=><button key={t.id} className={'hl-nb'+(tab===t.id?' on':'')} onClick={()=>setTab(t.id)}>{t.label}</button>)}</div>
      </div>
      <div className='hl-body'>
        {loadError&&<div className='hl-err-banner'>⚠️ {loadError}</div>}
        {tab==='plan'&&<MealPlan plan={plan} setPlan={setPlan} allRecipes={allRecipes} onViewSteps={setStepsRec}/>}
        {tab==='recipes'&&<RecipesTab allRecipes={allRecipes} onImport={addRecipe} onSave={saveRecipe} onDelete={delRecipe} deletedRecipes={deletedRecipes} onRestore={restoreRecipe}/>}
        {tab==='shopping'&&<Shopping plan={plan} allRecipes={allRecipes} viewKey={viewKey} shopChecked={shopChecked} onToggleShop={onToggleShop} shopEdits={shopEdits} onShopEdit={onShopEdit} shopRemoved={shopRemoved} onShopRemove={onShopRemove} onShopRestore={onShopRestore} shopExtras={shopExtras} setShopExtras={saveShopExtras} essentials={essentials} setEssentials={saveEssentials} essChecked={essChecked} onToggleEss={onToggleEss} adhoc={adhoc} setAdhoc={saveAdhoc} adhocChecked={adhocChecked} onToggleAdhoc={onToggleAdhoc} catOverrides={catOverrides} onCatOverride={saveCatOverrides} pantry={pantry}/>}
        {tab==='nutrition'&&<NutritionTab plan={plan} allRecipes={allRecipes}/>}
        {tab==='pantry'&&<PantryTab pantry={pantry} onSave={savePantry} plan={plan} allRecipes={allRecipes} viewKey={viewKey}/>}
      </div>
    </div>
  </>;
}
ReactDOM.createRoot(document.getElementById('hl-root')).render(<App/>);
</script>
</body>
</html>
