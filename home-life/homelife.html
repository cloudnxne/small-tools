<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Home Life</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Lora:ital,wght@0,400;0,500;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#F7F2EB;}
#hl-root{min-height:100vh;}
.hl{min-height:100vh;background:#F7F2EB;font-family:'DM Sans',sans-serif;color:#2C2416;}
/* HEADER */
.hl-hdr{background:#2A4A1E;padding:16px 28px 0;position:sticky;top:0;z-index:100;box-shadow:0 4px 20px rgba(42,74,30,.28);}
.hl-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:10px;}
.hl-logo{font-family:'Playfair Display',serif;font-size:22px;color:#F0E6CA;letter-spacing:-.5px;}
.hl-logo em{color:#C4784A;font-style:italic;}
.hl-tag{font-family:'Lora',serif;font-size:10px;color:#8CAD78;font-style:italic;margin-top:1px;}
/* SYNC STATUS */
.hl-sync{display:flex;align-items:center;gap:5px;font-size:11px;font-family:'DM Sans',sans-serif;}
.hl-sync-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.sync-saved .hl-sync-dot{background:#8CAD78;}
.sync-saved .hl-sync-txt{color:#8CAD78;}
.sync-saving .hl-sync-dot{background:#E8B84B;animation:pulse .8s infinite;}
.sync-saving .hl-sync-txt{color:#E8B84B;}
.sync-error .hl-sync-dot{background:#E07070;}
.sync-error .hl-sync-txt{color:#E07070;}
.sync-loading .hl-sync-dot{background:#8CAD78;animation:pulse .6s infinite;}
.sync-loading .hl-sync-txt{color:#C9D9C0;}
.hl-backup-btn{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);color:#C9D9C0;font-family:'DM Sans',sans-serif;font-size:11px;font-weight:500;padding:4px 11px;border-radius:20px;cursor:pointer;display:flex;align-items:center;gap:5px;transition:all .2s;white-space:nowrap;}
.hl-backup-btn:hover{background:rgba(255,255,255,.22);color:white;}
/* Backup modal */
.hl-bkmodal{background:white;border-radius:20px;max-width:420px;width:100%;margin:auto;box-shadow:0 24px 64px rgba(0,0,0,.25);overflow:hidden;}
.hl-bkmodal-hdr{background:#2A4A1E;padding:16px 22px;display:flex;justify-content:space-between;align-items:center;}
.hl-bkmodal-hdr h2{font-family:'Playfair Display',serif;font-size:18px;color:#F0E6CA;}
.hl-bkmodal-body{padding:22px;display:flex;flex-direction:column;gap:14px;}
.hl-bk-row{display:flex;flex-direction:column;gap:6px;padding:16px;border-radius:12px;border:1.5px solid #EDE8DF;background:#FDFAF6;}
.hl-bk-row h3{font-family:'Playfair Display',serif;font-size:15px;color:#2A4A1E;}
.hl-bk-row p{font-family:'Lora',serif;font-style:italic;font-size:12px;color:#9A8E7A;line-height:1.5;}
.hl-bk-btn{border:none;border-radius:8px;padding:9px 18px;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:600;cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:6px;align-self:flex-start;}
.hl-bk-dl{background:#2A4A1E;color:white;}
.hl-bk-dl:hover{background:#1A3A10;}
.hl-bk-up{background:#C4784A;color:white;}
.hl-bk-up:hover{background:#A85E34;}
.hl-bk-msg{font-size:12px;padding:8px 12px;border-radius:7px;font-family:'DM Sans',sans-serif;}
.hl-bk-ok{background:#EAF2E5;color:#2A4A1E;}
.hl-bk-err{background:#FEF0E8;color:#C4784A;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.3;}}
/* WEEK NAV */
.hl-wk{display:flex;align-items:center;gap:6px;}
.hl-wkarr{background:rgba(255,255,255,.12);border:none;color:#C9D9C0;width:28px;height:28px;border-radius:50%;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;flex-shrink:0;}
.hl-wkarr:hover{background:rgba(255,255,255,.22);color:white;}
.hl-wkarr:disabled{opacity:.3;cursor:not-allowed;}
.hl-wkinfo{text-align:center;min-width:160px;}
.hl-wklbl{font-size:11px;font-weight:600;color:#F0E6CA;letter-spacing:.3px;}
.hl-wkdate{font-family:'Lora',serif;font-style:italic;font-size:10px;color:#8CAD78;margin-top:1px;}
.hl-wkdots{display:flex;justify-content:center;gap:4px;margin-top:4px;}
.hl-wkdot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.2);cursor:pointer;transition:all .2s;}
.hl-wkdot.has{background:#8CAD78;}
.hl-wkdot.cur{background:#C4784A;transform:scale(1.3);}
/* NAV */
.hl-nav{display:flex;gap:2px;flex-wrap:wrap;}
.hl-nb{background:none;border:none;font-family:'DM Sans',sans-serif;font-size:11px;font-weight:500;letter-spacing:.5px;color:#8CAD78;padding:8px 16px;border-radius:10px 10px 0 0;cursor:pointer;transition:all .2s;text-transform:uppercase;}
.hl-nb:hover{color:#F0E6CA;background:rgba(255,255,255,.08);}
.hl-nb.on{background:#F7F2EB;color:#2A4A1E;font-weight:600;}
.hl-body{padding:24px 28px;max-width:1180px;margin:0 auto;}
.hl-h1{font-family:'Playfair Display',serif;font-size:28px;color:#2A4A1E;margin-bottom:4px;}
.hl-sub{font-family:'Lora',serif;font-style:italic;font-size:13px;color:#7A6B52;margin-bottom:22px;}
.hl-row{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:10px;margin-bottom:22px;}
/* LOADING SCREEN */
.hl-loading{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;gap:16px;}
.hl-loading-spinner{width:40px;height:40px;border:3px solid #E0D8CA;border-top-color:#2A4A1E;border-radius:50%;animation:spin 1s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.hl-loading-txt{font-family:'Lora',serif;font-style:italic;color:#7A6B52;font-size:14px;}
.hl-err-banner{background:#FEF0E8;border:1px solid #E8C8B0;border-radius:10px;padding:12px 16px;margin-bottom:20px;font-size:13px;color:#C4784A;display:flex;align-items:center;gap:8px;}
/* PLAN */
.hl-pgrid{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
@media(max-width:720px){.hl-pgrid{grid-template-columns:1fr;}}
.hl-card{background:white;border-radius:16px;overflow:hidden;box-shadow:0 2px 16px rgba(42,74,30,.08);}
.hl-cardh{background:#2A4A1E;padding:12px 16px;font-family:'Playfair Display',serif;font-size:14px;color:#F0E6CA;}
/* Desktop table */
.hl-pt{width:100%;border-collapse:collapse;}
.hl-pt th{background:#F0E6CA;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.7px;color:#7A6B52;padding:7px 12px;text-align:left;}
.hl-pt td{padding:6px 10px;border-bottom:1px solid #F0EBE0;vertical-align:top;}
.hl-pt tr:last-child td{border-bottom:none;}
.hl-dlbl{font-weight:600;color:#2A4A1E;font-size:12px;white-space:nowrap;width:74px;padding-top:10px !important;}
/* Mobile meal rows — stacked card style */
.hl-mob-day{border-bottom:1px solid #F0EBE0;padding:10px 14px;}
.hl-mob-day:last-child{border-bottom:none;}
.hl-mob-daylbl{font-weight:700;font-size:12px;color:#2A4A1E;margin-bottom:7px;}
.hl-mob-slot{margin-bottom:6px;}
.hl-mob-slot:last-child{margin-bottom:0;}
.hl-mob-slotlbl{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;color:#9A8E7A;margin-bottom:3px;}
/* Hide/show for responsive */
@media(max-width:640px){
  .hl-desktop-only{display:none !important;}
  .hl-mobile-only{display:block !important;}
}
@media(min-width:641px){
  .hl-desktop-only{display:table !important;}
  .hl-mobile-only{display:none !important;}
}
.hl-sel{width:100%;border:1.5px solid #E0D8CA;border-radius:7px;padding:5px 7px;font-family:'DM Sans',sans-serif;font-size:12px;color:#2C2416;background:#FDFAF6;cursor:pointer;outline:none;transition:border-color .2s;}
.hl-sel:focus{border-color:#2A4A1E;}
.hl-sel.ok{border-color:#8CAD78;background:#F3F9F0;color:#2A4A1E;}
/* Searchable dropdown */
.hl-sdd{position:relative;width:100%;}
.hl-sdd-trigger{width:100%;border:1.5px solid #E0D8CA;border-radius:7px;padding:5px 26px 5px 8px;font-family:'DM Sans',sans-serif;font-size:12px;color:#2C2416;background:#FDFAF6;cursor:pointer;outline:none;transition:border-color .2s;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;position:relative;}
.hl-sdd-trigger.ok{border-color:#8CAD78;background:#F3F9F0;color:#2A4A1E;}
.hl-sdd-trigger:hover{border-color:#2A4A1E;}
.hl-sdd-trigger::after{content:'▾';position:absolute;right:8px;top:50%;transform:translateY(-50%);font-size:10px;color:#9A8E7A;pointer-events:none;}
/* Portal panel — fixed to viewport, never clipped */
.hl-sdd-panel{position:fixed;background:white;border:1.5px solid #2A4A1E;border-radius:9px;box-shadow:0 8px 32px rgba(42,74,30,.22);z-index:9999;overflow:hidden;}
.hl-sdd-search{display:flex;align-items:center;padding:9px 10px;border-bottom:1px solid #EDE8DF;gap:6px;background:#FAFAF5;position:sticky;top:0;}
.hl-sdd-search input{flex:1;border:none;outline:none;font-family:'DM Sans',sans-serif;font-size:13px;color:#2C2416;background:transparent;}
.hl-sdd-search input::placeholder{color:#C8BFA8;}
.hl-sdd-list{overflow-y:auto;}
.hl-sdd-opt{padding:10px 14px;font-family:'DM Sans',sans-serif;font-size:13px;color:#2C2416;cursor:pointer;transition:background .1s;border-bottom:1px solid #F5F0E8;}
.hl-sdd-opt:last-child{border-bottom:none;}
.hl-sdd-opt:hover,.hl-sdd-opt.focused{background:#EAF2E5;color:#2A4A1E;}
.hl-sdd-opt.selected{background:#F3F9F0;color:#2A4A1E;font-weight:600;}
.hl-sdd-opt.placeholder{color:#9A8E7A;font-style:italic;}
.hl-sdd-empty{padding:14px;text-align:center;font-family:'Lora',serif;font-style:italic;font-size:12px;color:#9A8E7A;}
.hl-sdd-clear{background:none;border:none;color:#C8BFA8;cursor:pointer;font-size:14px;line-height:1;padding:0 2px;flex-shrink:0;}
.hl-sdd-clear:hover{color:#C4784A;}
/* Mobile centred modal for dropdown (avoids keyboard clipping) */
.hl-sdd-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:9998;display:flex;align-items:center;justify-content:center;padding:16px;}
.hl-sdd-sheet{position:relative;background:white;border-radius:16px;box-shadow:0 8px 40px rgba(0,0,0,.25);z-index:9999;width:100%;max-width:420px;max-height:70vh;display:flex;flex-direction:column;}
.hl-sdd-sheet-hdr{padding:12px 14px 10px;border-bottom:1px solid #EDE8DF;display:flex;align-items:center;gap:8px;background:#FAFAF5;border-radius:16px 16px 0 0;position:sticky;top:0;}
.hl-sdd-sheet-hdr input{flex:1;border:1.5px solid #E0D8CA;border-radius:8px;padding:8px 12px;font-family:'DM Sans',sans-serif;font-size:14px;color:#2C2416;background:white;outline:none;}
.hl-sdd-sheet-hdr input:focus{border-color:#2A4A1E;}
.hl-sdd-sheet-list{overflow-y:auto;flex:1;}
.hl-sdd-sheet-opt{padding:13px 16px;font-family:'DM Sans',sans-serif;font-size:14px;color:#2C2416;cursor:pointer;border-bottom:1px solid #F5F0E8;}
.hl-sdd-sheet-opt:last-child{border-bottom:none;}
.hl-sdd-sheet-opt:active{background:#EAF2E5;}
.hl-sdd-sheet-opt.selected{color:#2A4A1E;font-weight:600;background:#F3F9F0;}
.hl-sdd-sheet-opt.placeholder{color:#9A8E7A;font-style:italic;}
.hl-sdd-sheet-empty{padding:20px;text-align:center;font-family:'Lora',serif;font-style:italic;font-size:13px;color:#9A8E7A;}
.hl-meal-hint{display:flex;align-items:center;gap:6px;margin-top:3px;flex-wrap:wrap;}
.hl-nut-hint{font-size:10px;color:#8CAD78;display:flex;gap:5px;flex-wrap:wrap;}
.hl-steps-btn{background:none;border:1px solid #D0C8B8;color:#7A6B52;border-radius:6px;padding:2px 7px;font-size:10px;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .2s;white-space:nowrap;}
.hl-steps-btn:hover{border-color:#2A4A1E;color:#2A4A1E;}
.hl-bulk-btn{border:1px solid #B0A8D8;color:#6A5A8A;background:none;border-radius:6px;padding:2px 7px;font-size:10px;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .2s;white-space:nowrap;}
.hl-bulk-btn:hover{background:#F0EEF8;}
.hl-bulk-btn.on{background:#6A5A8A;border-color:#6A5A8A;color:white;}
.hl-skip-btn{border:1px solid #D0C8B8;color:#9A8E7A;background:none;border-radius:6px;padding:2px 7px;font-size:10px;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .2s;white-space:nowrap;}
.hl-skip-btn:hover{background:#F5F0E8;}
.hl-skip-btn.on{background:#5B7A35;border-color:#5B7A35;color:white;}
.hl-freezer-btn{border:1px solid #D0C8B8;color:#9A8E7A;background:none;border-radius:6px;padding:2px 7px;font-size:10px;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .2s;white-space:nowrap;}
.hl-freezer-btn:hover{background:#F5F0E8;}
.hl-freezer-btn.on{background:#5B7A35;border-color:#5B7A35;color:white;}
/* Pantry */
.hl-pantry-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;margin-top:12px;}
.hl-pantry-card{background:white;border-radius:14px;padding:0;box-shadow:0 2px 12px rgba(42,74,30,.07);overflow:hidden;display:flex;flex-direction:column;}
.hl-pantry-ch{background:linear-gradient(135deg,#3A6B2A,#2A4A1E);padding:10px 14px;display:flex;align-items:center;gap:8px;}
.hl-pantry-ch h3{font-family:'Playfair Display',serif;font-size:14px;color:#F0E6CA;flex:1;}
.hl-pantry-item{display:flex;align-items:center;gap:8px;padding:9px 14px;border-bottom:1px solid #F5F0E8;}
.hl-pantry-item:last-child{border-bottom:none;}
.hl-pantry-amt{background:#EAF2E5;color:#2A4A1E;border-radius:6px;font-size:11px;font-weight:700;padding:2px 8px;flex-shrink:0;cursor:pointer;white-space:nowrap;transition:background .15s;}
.hl-pantry-amt:hover{background:#D4EAC8;}
.hl-pantry-amt.low{background:#FEF0E8;color:#C4784A;}
.hl-pantry-amt.empty{background:#FEF0E8;color:#C0392B;text-decoration:line-through;}
.hl-pantry-name{flex:1;font-family:'DM Sans',sans-serif;font-size:12px;color:#2C2416;}
.hl-pantry-addrow{display:flex;gap:6px;padding:10px 14px;border-top:1px dashed #E8E0D0;flex-wrap:wrap;background:#FAFAF5;}
.hl-pantry-input{flex:1;min-width:100px;border:1.5px solid #E0D8CA;border-radius:7px;padding:5px 8px;font-family:'DM Sans',sans-serif;font-size:12px;color:#2C2416;background:white;outline:none;}
.hl-pantry-input:focus{border-color:#2A4A1E;}
.hl-pantry-num{width:60px;border:1.5px solid #E0D8CA;border-radius:7px;padding:5px 6px;font-family:'DM Sans',sans-serif;font-size:12px;color:#2C2416;background:white;outline:none;flex-shrink:0;}
.hl-pantry-num:focus{border-color:#2A4A1E;}
.hl-pantry-unit{border:1.5px solid #E0D8CA;border-radius:7px;padding:4px 6px;font-family:'DM Sans',sans-serif;font-size:11px;color:#7A6B52;background:#FDFAF6;outline:none;flex-shrink:0;}
.hl-pantry-badge{font-size:9px;background:#EAF2E5;color:#3A6B2A;border-radius:4px;padding:1px 5px;font-weight:600;margin-left:4px;}
.hl-pantry-badge.covered{background:#EAF2E5;color:#3A6B2A;}
.hl-pantry-badge.partial{background:#FEF0E8;color:#C4784A;}
.hl-week-use-btn{background:#5B7A35;border:none;color:white;border-radius:8px;padding:7px 14px;font-family:'DM Sans',sans-serif;font-size:12px;font-weight:600;cursor:pointer;transition:background .2s;display:flex;align-items:center;gap:6px;}
.hl-week-use-btn:hover{background:#3A6B2A;}
.hl-freezer-btn{border:1px solid #8AB8D8;color:#3A6A9A;background:none;border-radius:6px;padding:2px 7px;font-size:10px;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .2s;white-space:nowrap;}
.hl-freezer-btn:hover{background:#EAF2FB;}
.hl-freezer-btn.on{background:#3A6A9A;border-color:#3A6A9A;color:white;}
.hl-bulk-badge{background:#6A5A8A;color:white;border-radius:4px;font-size:9px;font-weight:700;padding:1px 5px;}
.hl-clr{background:none;border:1.5px dashed #D0C8B8;color:#9A8E7A;border-radius:8px;padding:5px 12px;font-size:11px;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .2s;}
.hl-clr:hover{border-color:#C4784A;color:#C4784A;}
/* RECIPES */
.hl-recipe-top{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:10px;margin-bottom:16px;}
.hl-import-btn{background:#2A4A1E;border:none;color:white;font-family:'DM Sans',sans-serif;font-size:12px;font-weight:600;padding:8px 18px;border-radius:20px;cursor:pointer;transition:background .2s;}
.hl-import-btn:hover{background:#1A3A10;}
.hl-recipe-controls{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;align-items:center;}
.hl-search{flex:1;min-width:180px;border:1.5px solid #E0D8CA;border-radius:8px;padding:7px 12px;font-family:'DM Sans',sans-serif;font-size:12px;color:#2C2416;background:#FDFAF6;outline:none;transition:border-color .2s;}
.hl-search:focus{border-color:#2A4A1E;}
.hl-sort-sel{border:1.5px solid #E0D8CA;border-radius:8px;padding:7px 10px;font-family:'DM Sans',sans-serif;font-size:12px;color:#7A6B52;background:#FDFAF6;outline:none;cursor:pointer;}
.hl-recipe-count{font-size:11px;color:#9A8E7A;font-family:'Lora',serif;font-style:italic;white-space:nowrap;}
.hl-ctabs{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:20px;}
.hl-ct{background:white;border:1.5px solid #D9D0C0;border-radius:24px;padding:5px 14px;font-size:11px;font-weight:500;color:#7A6B52;cursor:pointer;transition:all .2s;font-family:'DM Sans',sans-serif;}
.hl-ct:hover{border-color:#2A4A1E;color:#2A4A1E;}
.hl-ct.on{background:#2A4A1E;border-color:#2A4A1E;color:white;}
.hl-rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;}
.hl-rc{background:white;border-radius:14px;padding:14px 16px;box-shadow:0 2px 12px rgba(42,74,30,.06);border:1px solid #EDE8DF;transition:all .2s;display:flex;flex-direction:column;gap:6px;cursor:pointer;}
.hl-rc:hover{box-shadow:0 6px 24px rgba(42,74,30,.14);transform:translateY(-2px);}
.hl-rc.custom{border-color:#C4784A30;}
.hl-rn{font-family:'Playfair Display',serif;font-size:14px;color:#2C2416;font-weight:600;}
.hl-rm{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.hl-sp{background:#EAF2E5;color:#3A6B2A;border-radius:20px;font-size:10px;font-weight:600;padding:2px 8px;}
.hl-cbadge{background:#C4784A18;color:#C4784A;border:1px solid #C4784A35;border-radius:10px;font-size:9px;font-weight:700;padding:1px 6px;}
.hl-nut-row{display:flex;gap:7px;flex-wrap:wrap;background:#F9F6F0;border-radius:7px;padding:6px 9px;}
.hl-macro{display:flex;flex-direction:column;align-items:center;gap:1px;}
.hl-macro-val{font-size:13px;font-weight:700;}
.hl-macro-lbl{font-size:8px;text-transform:uppercase;letter-spacing:.5px;color:#9A8E7A;}
.c-k{color:#C4784A;}.c-p{color:#3A7FBD;}.c-c{color:#B8820A;}.c-f{color:#8A5A8A;}.c-fi{color:#4A8A5A;}
.hl-rl{display:inline-flex;align-items:center;gap:3px;color:#C4784A;font-size:11px;font-weight:500;text-decoration:none;margin-top:1px;}
.hl-rl:hover{opacity:.7;text-decoration:underline;}
/* SHOPPING */
.hl-stabs{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap;}
.hl-st{background:white;border:1.5px solid #D9D0C0;border-radius:10px;padding:7px 15px;font-size:12px;font-weight:500;color:#7A6B52;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .2s;display:flex;align-items:center;gap:5px;}
.hl-st:hover{border-color:#2A4A1E;}
.hl-st.on{background:#2A4A1E;border-color:#2A4A1E;color:white;}

const { useState, useMemo, useEffect, useRef, useCallback } = React;

// Path to the PHP file — update if you rename it or put it elsewhere
const API = 'homelife-data.php';

/* ── WEEK HELPERS ────────────────────────────────────────── */
function getFridayKey(off=0){
  const d=new Date(); d.setDate(d.getDate()+off*7);
  const day=d.getDay();
  const daysBack=day>=5?day-5:day+2;
  d.setDate(d.getDate()-daysBack);
  return d.toISOString().split('T')[0];
}
function getWeekKey(off=0){ return getFridayKey(off); }

// Given a raw plans object from the server, migrate any plans stored under
// old key formats (Monday-based, etc.) into Friday-based keys so data
// is never lost after an app update. Scans ±3 days around each known Friday.
function migratePlans(rawPlans){
  if(!rawPlans)return{};
  const result={...rawPlans};
  // Build a set of all valid Friday keys we care about
  const fridayKeys=new Set(WEEK_OFFSETS.map(o=>getFridayKey(o)));
  Object.keys(rawPlans).forEach(k=>{
    if(fridayKeys.has(k))return; // already correct format
    const d=new Date(k+'T12:00:00');
    if(isNaN(d.getTime()))return;
    // Find the nearest Friday within ±3 days
    for(let delta=-3;delta<=3;delta++){
      const candidate=new Date(d);
      candidate.setDate(d.getDate()+delta);
      const candidateKey=candidate.toISOString().split('T')[0];
      if(fridayKeys.has(candidateKey)){
        // Migrate: merge old into new (don't overwrite if new already has data)
        if(!result[candidateKey]||!Object.values(result[candidateKey]).some(v=>v.dinner||v.alex||v.sam)){
          result[candidateKey]=rawPlans[k];
        }
        delete result[k];
        break;
      }
    }
  });
  return result;
}
function keyToLabel(k){
  // Label shows Sat (day after Friday key) through to following Friday
  const fri=new Date(k+'T12:00:00');
  const sat=new Date(fri); sat.setDate(fri.getDate()+1);
  const nextFri=new Date(fri); nextFri.setDate(fri.getDate()+7);
  const f={day:'numeric',month:'short'};
  return`${sat.toLocaleDateString('en-GB',f)} – ${nextFri.toLocaleDateString('en-GB',f)}`;
}
function keyToRelLabel(k){
  const diff=Math.round((new Date(k+'T12:00:00')-new Date(getWeekKey(0)+'T12:00:00'))/(7*864e5));
  return diff===0?'This Week':diff===1?'Next Week':diff===-1?'Last Week':diff===2?'2 Weeks Ahead':diff===-2?'2 Weeks Ago':keyToLabel(k);
}

const DAYS=['Saturday','Sunday','Monday','Tuesday','Wednesday','Thursday','Friday'];
const DEF_PLAN={...Object.fromEntries(DAYS.map(d=>[d,{dinner:'',alex:'',sam:''}])),bulkCook:[],addToList:[]};
const DEF_ESS=['Apples','Bananas','Blueberries','Cows Milk','Oat Milk','Greek Yoghurt','Eggs','Brown bread flour','Butter','Cherry Tomatoes','Walnuts','Chia Seeds','Dishwasher cleaner (monthly)','Loo roll (monthly)','Tissues'];
// SKIP_RECIPE = don't try to look these up as recipes

// SKIP_DISPLAY = treat as "nothing selected" in the dropdown trigger

  {id:'produce',label:'🥦 Fresh Produce & Herbs'},{id:'meat',label:'🥩 Meat, Fish & Veg Protein'},
  {id:'dairy',label:'🧀 Dairy & Eggs'},{id:'frozen',label:'🧊 Frozen'},
  {id:'bakery',label:'🍞 Bakery & Bread'},{id:'grains',label:'🍝 Pasta, Rice & Grains'},
  {id:'tins',label:'🥫 Tins, Jars & Stock'},{id:'sauces',label:'🫙 Sauces & Condiments'},
  {id:'spices',label:'🌿 Spices & Herbs (Dried)'},{id:'other',label:'🛒 Other'},
];
function cat(ing,overrides){
  const k=ing.toLowerCase().replace(/[^a-z0-9 ]/g,'').trim();
  if(overrides&&overrides[k])return overrides[k];
  const s=ing.toLowerCase();
  if(/chicken breast|chicken thigh|beef mince|lamb mince|pork shoulder|rib.eye|brisket|sausage|bacon|chorizo|fish finger|seafood|tofu/.test(s))return'meat';
  if(/\begg|butter\b|parmesan|feta\b|sour cream|double cream|oat cream|yoghurt|cheddar|mozzarella|milk/.test(s)&&!/coconut/.test(s))return'dairy';

/* ── SHARED HELPERS ──────────────────────────────────────── */
function Sel({value,onChange,options}){
  return <select className={'hl-sel'+(value&&!SKIP.includes(value)?' ok':'')} value={value||''} onChange={e=>onChange(e.target.value)}>
    <option value=''>— Select —</option>
    {options.map(o=><option key={o} value={o}>{o}</option>)}
  </select>;
}

/* Searchable dropdown — portal-based so it's never clipped, mobile bottom sheet */
function SearchSel({value,onChange,options,placeholder}){
  const[open,setOpen]=useState(false);
  const[query,setQuery]=useState('');
  const[focusIdx,setFocusIdx]=useState(0);
  const[panelStyle,setPanelStyle]=useState({});
  const[isMobile,setIsMobile]=useState(false);
  const triggerRef=useRef(null);
  const inputRef=useRef(null);
  const listRef=useRef(null);
  const portalRoot=typeof document!=='undefined'?document.body:null;

  const ph=placeholder||'— Select —';
  const hasVal=value&&value!=='';
  const isRecipe=hasVal&&!SKIP_RECIPE.includes(value);

  const filtered=useMemo(()=>{
    const q=query.trim().toLowerCase();
    if(!q)return options;
    return options.filter(o=>o.toLowerCase().includes(q));
  },[options,query]);

  // Detect mobile (touch device or narrow screen)
  useEffect(()=>{
    const check=()=>setIsMobile(window.innerWidth<640||'ontouchstart' in window);
    check();
    window.addEventListener('resize',check);
    return()=>window.removeEventListener('resize',check);
  },[]);

  // Position the portal panel relative to trigger, opening up if near bottom
  const positionPanel=useCallback(()=>{
    if(!triggerRef.current)return;
    const rect=triggerRef.current.getBoundingClientRect();
    const viewH=window.innerHeight;
    const panelH=260; // approx max height
    const spaceBelow=viewH-rect.bottom-8;
    const spaceAbove=rect.top-8;
    const goUp=spaceBelow<panelH&&spaceAbove>spaceBelow;
    const width=Math.max(rect.width,240);
    const left=Math.min(rect.left,window.innerWidth-width-8);
    if(goUp){
      setPanelStyle({bottom:viewH-rect.top+4,left,width,maxHeight:Math.min(spaceAbove,280)});
    } else {
      setPanelStyle({top:rect.bottom+4,left,width,maxHeight:Math.min(spaceBelow,280)});
    }
  },[]);

  useEffect(()=>{
    if(open&&!isMobile){
      positionPanel();
      const onScroll=()=>positionPanel();
      window.addEventListener('scroll',onScroll,true);
      window.addEventListener('resize',onScroll);
      return()=>{window.removeEventListener('scroll',onScroll,true);window.removeEventListener('resize',onScroll);};
    }
  },[open,isMobile,positionPanel]);

  // Focus input when panel opens
  useEffect(()=>{
    if(open){
      setQuery('');setFocusIdx(0);
      setTimeout(()=>inputRef.current?.focus(),50);
    }
  },[open]);

  // Scroll focused item into view
  useEffect(()=>{
    if(open&&listRef.current){
      const el=listRef.current.querySelector('.focused');
      if(el)el.scrollIntoView({block:'nearest'});
    }
  },[focusIdx,open]);

  // Close on outside click
  useEffect(()=>{
    if(!open)return;
    const handler=(e)=>{
      if(triggerRef.current&&triggerRef.current.contains(e.target))return;
      // Check if click is inside the portal panel (by class)
      if(e.target.closest('.hl-sdd-panel,.hl-sdd-sheet'))return;
      setOpen(false);
    };
    document.addEventListener('mousedown',handler);
    document.addEventListener('touchstart',handler);
    return()=>{document.removeEventListener('mousedown',handler);document.removeEventListener('touchstart',handler);};
  },[open]);

  const select=(opt)=>{onChange(opt==='__clear__'?'':opt);setOpen(false);};

  const onKeyDown=(e)=>{
    if(e.key==='Escape'){setOpen(false);return;}
    if(e.key==='ArrowDown'){e.preventDefault();setFocusIdx(i=>Math.min(i+1,filtered.length-1));return;}
    if(e.key==='ArrowUp'){e.preventDefault();setFocusIdx(i=>Math.max(i-1,0));return;}
    if(e.key==='Enter'&&filtered[focusIdx]!==undefined){e.preventDefault();select(filtered[focusIdx]);return;}
  };

  const panel = isMobile ? (
    <>
      <div className='hl-sdd-backdrop' onClick={()=>setOpen(false)}/>
      <div className='hl-sdd-sheet'>
        <div className='hl-sdd-sheet-hdr'>
          <input ref={inputRef} type='text' placeholder='Search meals…' value={query}
            onChange={e=>{setQuery(e.target.value);setFocusIdx(0);}}
            onKeyDown={onKeyDown}/>
          <button className='hl-sdd-clear' onClick={()=>setOpen(false)}>✕</button>
        </div>
        <div className='hl-sdd-sheet-list'>
          <div className={'hl-sdd-sheet-opt placeholder'+(!value?' selected':'')} onClick={()=>select('__clear__')}>{ph}</div>
          {filtered.length===0
            ?<div className='hl-sdd-sheet-empty'>No matches for "{query}"</div>
            :filtered.map((opt)=>(
              <div key={opt} className={'hl-sdd-sheet-opt'+(opt===value?' selected':'')} onClick={()=>select(opt)}>{opt}</div>
            ))
          }
        </div>
      </div>
    </>
  ) : (
    <div className='hl-sdd-panel' style={panelStyle}>
      <div className='hl-sdd-search'>
        <span style={{fontSize:12,color:'#C8BFA8'}}>🔍</span>
        <input ref={inputRef} type='text' placeholder='Search meals…' value={query}
          onChange={e=>{setQuery(e.target.value);setFocusIdx(0);}}
          onKeyDown={onKeyDown}/>
        {query&&<button className='hl-sdd-clear' onClick={()=>{setQuery('');setFocusIdx(0);inputRef.current?.focus();}}>✕</button>}
      </div>
      <div className='hl-sdd-list' ref={listRef} style={{maxHeight:panelStyle.maxHeight?panelStyle.maxHeight-48:220,overflowY:'auto'}}>
        <div className={'hl-sdd-opt placeholder'+(!value?' selected':'')} onClick={()=>select('__clear__')}>{ph}</div>
        {filtered.length===0
          ?<div className='hl-sdd-empty'>No matches for "{query}"</div>
          :filtered.map((opt,i)=>(
            <div key={opt}
              className={'hl-sdd-opt'+(opt===value?' selected':'')+(i===focusIdx?' focused':'')}
              onMouseEnter={()=>setFocusIdx(i)}
              onClick={()=>select(opt)}>
              {opt}
            </div>
          ))
        }
      </div>
    </div>
  );

  return(
    <div className='hl-sdd' ref={triggerRef}>
      <button type='button' className={'hl-sdd-trigger'+(isRecipe?' ok':'')}
        onClick={()=>setOpen(o=>!o)}>
        {hasVal?value:ph}
      </button>
      {open&&portalRoot&&ReactDOM.createPortal(panel,portalRoot)}
    </div>
  );
}
function MacroBar({protein,carbs,fat}){

  return <div className='hl-mbar-wrap'>
    <div className='hl-mbar-p' style={{width:Math.round(protein*4/t*100)+'%'}}/>
    <div className='hl-mbar-c' style={{width:Math.round(carbs*4/t*100)+'%'}}/>
    <div className='hl-mbar-f' style={{width:Math.round(fat*9/t*100)+'%'}}/>
  </div>;
}

/* ── IMPORT MODAL ────────────────────────────────────────── */
function ImportModal({onClose,onAdd}){
  const[url,setUrl]=useState('');
  const[status,setStatus]=useState(null);
  const[loading,setLoading]=useState(false);
  const[form,setForm]=useState({name:'',cuisine:'European & UK',serves:'4',link:'',ingredients:'',instructions:'',kcal:'',protein:'',carbs:'',fat:'',fibre:''});
  const upd=(k,v)=>setForm(f=>({...f,[k]:v}));

  function parseLD(html){
    const re=/<script[^>]+type=["']application\/ld\+json["'][^>]*>([\s\S]*?)<\/script>/gi;
    let m;
    while((m=re.exec(html))!==null){
      try{
        const d=JSON.parse(m[1]);
        const items=Array.isArray(d)?d:(d['@graph']||[d]);
        for(const item of items){
          const t=item['@type'];
          if(t==='Recipe'||(Array.isArray(t)&&t.includes('Recipe')))return item;
        }
      }catch(e){}
    }
    return null;
  }

  const fetchFromUrl=async()=>{
    if(!url.trim()){setStatus({type:'error',msg:'Please enter a URL.'});return;}
    setLoading(true);setStatus({type:'loading',msg:'Reading recipe data from page…'});
    try{
      const res=await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(url.trim())}`);
      const data=await res.json();
      if(!data.contents)throw new Error('no content');
      const r=parseLD(data.contents);
      if(!r)throw new Error('no schema');
      const pn=v=>{if(!v)return'';const mx=String(v).match(/[\d.]+/);return mx?String(Math.round(parseFloat(mx[0]))):'';}
      const yld=r.recipeYield;let serves='4';
      if(yld){const n=Array.isArray(yld)?yld[0]:yld;const mx=String(n).match(/\d+/);if(mx)serves=mx[0];}
      const ings=(r.recipeIngredient||[]).map(i=>String(i).trim()).filter(Boolean);
      let instr=[];
      const ri=r.recipeInstructions;
      if(ri){
        if(typeof ri==='string'){instr=ri.split('\n').map(s=>s.trim()).filter(Boolean);}
        else if(Array.isArray(ri)){
          ri.forEach(s=>{
            if(typeof s==='string')instr.push(s.trim());
            else if(s.text)instr.push(s.text.trim());
            else if(s.itemListElement)s.itemListElement.forEach(ss=>instr.push((ss.text||'').trim()));
          });
          instr=instr.filter(Boolean);
        }
      }
      const nt=r.nutrition;
      setForm({name:r.name||'',cuisine:'European & UK',serves,link:url.trim(),
        ingredients:ings.join('\n'),instructions:instr.join('\n'),
        kcal:nt?pn(nt.calories):'',protein:nt?pn(nt.proteinContent):'',
        carbs:nt?pn(nt.carbohydrateContent):'',fat:nt?pn(nt.fatContent):'',
        fibre:nt?pn(nt.fiberContent||nt.fibreContent):'',
      });
      const parts=[];
      if(ings.length)parts.push(`${ings.length} ingredients`);
      if(instr.length)parts.push(`${instr.length} steps`);
      if(nt)parts.push('nutrition');
      setStatus({type:'info',msg:`✓ Found: ${parts.join(', ')}. Set the cuisine and save.`});
    }catch(e){
      setStatus({type:'error',msg:"This site doesn't publish structured recipe data. Fill in the details manually below."});
    }
    setLoading(false);
  };

  const save=()=>{
    if(!form.name.trim()){setStatus({type:'error',msg:'Please enter a recipe name.'});return;}
    const ings=form.ingredients.split('\n').map(s=>s.trim()).filter(Boolean);
    const instr=form.instructions.split('\n').map(s=>s.trim()).filter(Boolean);
    const hasNut=form.kcal||form.protein||form.carbs||form.fat;
    const nut=hasNut?{kcal:+form.kcal||0,protein:+form.protein||0,carbs:+form.carbs||0,fat:+form.fat||0,fibre:+form.fibre||0}:null;
    onAdd({name:form.name.trim(),cuisine:form.cuisine,serves:+form.serves||4,link:form.link.trim()||null,ingredients:ings,instructions:instr,nutrition:nut,custom:true});
    onClose();
  };

  return <div className='hl-ov' onClick={e=>{if(e.target===e.currentTarget)onClose();}}>
    <div className='hl-imodal'>
      <div className='hl-imodal-hdr'><h2>Import a Recipe</h2><button className='hl-close' onClick={onClose}>✕</button></div>
      <div className='hl-imodal-body'>
        <div className='hl-url-row'>
          <input className='hl-url-input' type='url' placeholder='Paste recipe URL…' value={url} onChange={e=>setUrl(e.target.value)} onKeyDown={e=>e.key==='Enter'&&fetchFromUrl()}/>
          <button className='hl-fetch-btn' onClick={fetchFromUrl} disabled={loading}>{loading?'Reading…':'🔗 Import from URL'}</button>
        </div>
        <p className='hl-fetch-note'>Works with BBC Good Food, AllRecipes, Serious Eats and most recipe sites.</p>
        {status&&<div className={`hl-status ${status.type}`}>{status.msg}</div>}
        <div className='hl-fgrid'>
          <div className='hl-ffull'><label className='hl-flabel'>Recipe Name *</label><input className='hl-finput' value={form.name} onChange={e=>upd('name',e.target.value)} placeholder='e.g. Lemon Herb Salmon'/></div>
          <div><label className='hl-flabel'>Cuisine</label><select className='hl-fsel' value={form.cuisine} onChange={e=>upd('cuisine',e.target.value)}>{CUISINES.slice(1).map(c=><option key={c}>{c}</option>)}</select></div>
          <div><label className='hl-flabel'>Serves</label><input className='hl-finput' type='number' value={form.serves} onChange={e=>upd('serves',e.target.value)}/></div>
          <div className='hl-ffull'><label className='hl-flabel'>Ingredients (one per line)</label><textarea className='hl-fta' value={form.ingredients} onChange={e=>upd('ingredients',e.target.value)} placeholder={'500g chicken\n2 garlic cloves'}/></div>
          <div className='hl-ffull'><label className='hl-flabel'>Instructions (one step per line)</label><textarea className='hl-fta' value={form.instructions} onChange={e=>upd('instructions',e.target.value)} placeholder={'Preheat oven…\nMix ingredients…'}/></div>
          <div className='hl-ffull hl-nut-section'>
            <h3>Nutrition per Serving</h3><p>Optional — leave blank if unknown</p>
            <div className='hl-nut-grid'>
              {[['Calories','kcal'],['Protein (g)','protein'],['Carbs (g)','carbs'],['Fat (g)','fat'],['Fibre (g)','fibre']].map(([l,k])=>(
                <div key={k}><label className='hl-flabel'>{l}</label><input className='hl-finput' type='number' min='0' value={form[k]} onChange={e=>upd(k,e.target.value)}/></div>
              ))}
            </div>
          </div>
        </div>
      </div>
      <div className='hl-imodal-footer'>
        <button className='hl-btn-cancel' onClick={onClose}>Cancel</button>
        <button className='hl-btn-primary' onClick={save}>Save Recipe ✓</button>
      </div>
    </div>
  </div>;
}

/* ── MEAL PLAN ───────────────────────────────────────────── */
function MealPlan({plan,setPlan,allRecipes,onViewSteps}){
  const allNames=['Eating Out','Leftovers',...allRecipes.map(r=>r.name).sort()];
  const lunchOpts=['Eating Out','Leftovers','Chicken','Soup','Salad','Sandwich','Jacket Potato','Omelette',...allRecipes.map(r=>r.name).sort()];
  const upd=(day,slot,val)=>setPlan(p=>{
    // When meal changes, remove from addToList — new meal defaults to not adding ingredients
    const k=`${day}_${slot}`;
    const cur=p.addToList||[];
    return{...p,[day]:{...p[day],[slot]:val},addToList:cur.filter(s=>s!==k)};
  });
  const getRec=name=>name&&!SKIP_RECIPE.includes(name)?allRecipes.find(r=>r.name===name):null;
  const bulkCook=plan.bulkCook||[];
  const addToList=plan.addToList||[];
  const slotKey=(day,slot)=>`${day}_${slot}`;
  const isBulk=name=>name&&bulkCook.includes(name);
  const isAdded=(day,slot)=>addToList.includes(slotKey(day,slot));
  const toggleBulk=name=>{
    const cur=plan.bulkCook||[];
    const next=cur.includes(name)?cur.filter(n=>n!==name):[...cur,name];
    setPlan(p=>({...p,bulkCook:next}));
  };
  const toggleAddToList=(day,slot)=>{
    const k=slotKey(day,slot);
    const cur=plan.addToList||[];
    const next=cur.includes(k)?cur.filter(s=>s!==k):[...cur,k];
    setPlan(p=>({...p,addToList:next}));
  };

  function MealHint({rec,day,slot}){
    if(!rec)return null;
    const bulk=isBulk(rec.name);
    const added=isAdded(day,slot);
    return <div className='hl-meal-hint'>
      {rec.nutrition&&<span className='hl-nut-hint'><span>🔥{rec.nutrition.kcal}</span><span>P{rec.nutrition.protein}g</span><span>C{rec.nutrition.carbs}g</span></span>}
      <button className='hl-steps-btn' onClick={()=>onViewSteps(rec)}>📋 Steps</button>
      <button className={'hl-skip-btn'+(added?' on':'')} onClick={()=>toggleAddToList(day,slot)}>
        🛒 {added?'On list ✓':'Add to list'}
      </button>
      {added&&<button className={'hl-bulk-btn'+(bulk?' on':'')} onClick={()=>toggleBulk(rec.name)}>
        🧊 {bulk?'Bulk cook ✓':'Bulk cook?'}
      </button>}
    </div>;
  }

  return <div>
    <div className='hl-row'>
      <div>
        <h1 className='hl-h1'>This Week's Plan</h1>
        <p className='hl-sub'>Select meals · tap 🛒 Add to list to include ingredients in shopping</p>
      </div>
      <button className='hl-clr' onClick={()=>setPlan({...DEF_PLAN})}>✕ Clear all</button>
    </div>
    <div className='hl-pgrid'>

      {/* ── EVENING MEALS ── */}
      <div className='hl-card'>
        <div className='hl-cardh'>🍽️ Evening Meals</div>
        <table className='hl-pt hl-desktop-only' style={{width:'100%',borderCollapse:'collapse'}}>
          <thead><tr><th>Day</th><th>Dinner</th></tr></thead>
          <tbody>{DAYS.map(d=>{
            const rec=getRec(plan[d].dinner);
            return <tr key={d}><td className='hl-dlbl'>{d}</td><td>
              <SearchSel value={plan[d].dinner} onChange={v=>upd(d,'dinner',v)} options={allNames}/>
              <MealHint rec={rec} day={d} slot="dinner"/>
            </td></tr>;
          })}</tbody>
        </table>
        <div className='hl-mobile-only'>
          {DAYS.map(d=>{const rec=getRec(plan[d].dinner);return <div key={d} className='hl-mob-day'>
            <div className='hl-mob-daylbl'>{d}</div>
            <SearchSel value={plan[d].dinner} onChange={v=>upd(d,'dinner',v)} options={allNames}/>
            <MealHint rec={rec} day={d} slot="dinner"/>
          </div>;})}
        </div>
      </div>

      {/* ── LUNCHES ── */}
      <div className='hl-card'>
        <div className='hl-cardh'>🥗 Lunches</div>
        <table className='hl-pt hl-desktop-only' style={{width:'100%',borderCollapse:'collapse'}}>
          <thead><tr><th>Day</th><th>Alex</th><th>Sam</th></tr></thead>
          <tbody>{DAYS.map(d=>{
            const ra=getRec(plan[d].alex),rg=getRec(plan[d].sam);
            return <tr key={d}><td className='hl-dlbl'>{d}</td>
              <td><SearchSel value={plan[d].alex} onChange={v=>upd(d,'alex',v)} options={lunchOpts}/><MealHint rec={ra} day={d} slot="alex"/></td>
              <td><SearchSel value={plan[d].sam} onChange={v=>upd(d,'sam',v)} options={lunchOpts}/><MealHint rec={rg} day={d} slot="sam"/></td>
            </tr>;
          })}</tbody>
        </table>
        <div className='hl-mobile-only'>
          {DAYS.map(d=>{
            const ra=getRec(plan[d].alex),rg=getRec(plan[d].sam);
            return <div key={d} className='hl-mob-day'>
              <div className='hl-mob-daylbl'>{d}</div>
              <div className='hl-mob-slot'>
                <div className='hl-mob-slotlbl'>Alex</div>
                <SearchSel value={plan[d].alex} onChange={v=>upd(d,'alex',v)} options={lunchOpts}/>
                <MealHint rec={ra} day={d} slot="alex"/>
              </div>
              <div className='hl-mob-slot'>
                <div className='hl-mob-slotlbl'>Sam</div>
                <SearchSel value={plan[d].sam} onChange={v=>upd(d,'sam',v)} options={lunchOpts}/>
                <MealHint rec={rg} day={d} slot="sam"/>
              </div>
            </div>;
          })}
        </div>
      </div>

    </div>

    {addToList.length>0&&(
      <div style={{marginTop:16,padding:'10px 14px',background:'#EAF2E5',borderRadius:10,border:'1px solid #C4DEB8',fontSize:12,fontFamily:"'DM Sans',sans-serif",color:'#2A4A1E',display:'flex',gap:8,flexWrap:'wrap',alignItems:'center'}}>
        <span style={{fontWeight:600}}>🛒 Adding to shopping list:</span>
        {[...new Set(DAYS.flatMap(d=>['dinner','alex','sam'].filter(s=>isAdded(d,s)).map(s=>plan[d][s]).filter(Boolean)))].map(n=><span key={n} style={{background:'#2A4A1E',color:'white',borderRadius:20,padding:'2px 10px',fontSize:11}}>{n}</span>)}
        {bulkCook.length>0&&<span style={{fontSize:11,color:'#5B7A35',marginLeft:4}}>· 🧊 bulk cooking: {bulkCook.join(', ')}</span>}
      </div>
    )}
  </div>;
}

// Scale an ingredient string by a multiplier
// e.g. "500g beef mince" × 2 → "1kg beef mince"
// e.g. "2 large onions" × 2 → "4 large onions"
function scaleIngredient(ing,mult){
  if(mult===1||!mult)return ing;
  // Match leading number (int or decimal or fraction)
  const m=ing.match(/^([\d]+(?:[\.,][\d]+)?(?:\/[\d]+)?)\s*(g|kg|ml|l|ltr|tsp|tbsp|cup|cups|x\s*\d+)?\s*(.*)/i);
  if(!m)return ing+` (×${mult})`;
  let num=parseFloat(m[1].replace(',','.'));
  const unit=(m[2]||'').trim();
  const rest=(m[3]||'').trim();
  let scaled=num*mult;
  // Convert g → kg if over 1000
  if(unit.toLowerCase()==='g'&&scaled>=1000){
    const kg=scaled/1000;
    const kgStr=Number.isInteger(kg)?`${kg}kg`:`${parseFloat(kg.toFixed(2))}kg`;
    return`${kgStr} ${rest}`.trim();
  }
  // Convert ml → l if over 1000
  if(unit.toLowerCase()==='ml'&&scaled>=1000){
    const l=scaled/1000;
    const lStr=Number.isInteger(l)?`${l}l`:`${parseFloat(l.toFixed(2))}l`;
    return`${lStr} ${rest}`.trim();
  }
  // Format number nicely
  const scaledStr=Number.isInteger(scaled)?`${scaled}`:`${parseFloat(scaled.toFixed(2))}`;
  return`${scaledStr}${unit?' '+unit:''} ${rest}`.trim();
}

/* ── SHOPPING ────────────────────────────────────────────── */
// Split ingredient string into { qty, name } for separate editing
// e.g. "500g beef mince" → {qty:"500g", name:"beef mince"}
// e.g. "2 large onions"  → {qty:"2",    name:"large onions"}
// e.g. "Fresh ginger"    → {qty:"",     name:"Fresh ginger"}
function splitIngredient(text){
  // Units must be followed by a space or end of string — prevents "g" eating "garlic", "l" eating "lime" etc.
  const m=text.match(/^([\d\/\.\-]+\s*(?:kg|g|ml|l|ltr|oz|lb|tsp|tbsp|cups?)(?=\s|$)(?:\s+(?:large|medium|small|heaped|level))?)\s+(.+)/i);
  if(m)return{qty:m[1].trim(),name:m[2].trim()};
  // Plain number (e.g. "2 large onions", "4 garlic cloves")
  const m2=text.match(/^(\d+(?:\.\d+)?)\s+((?:large|medium|small)\s+)?(.+)/i);
  if(m2&&!m2[3].match(/^(?:kg|g|ml|l|ltr|oz|lb|tsp|tbsp|cups?)\b/i))
    return{qty:(m2[1]+(m2[2]?` ${m2[2].trim()}`:'')).trim(),name:m2[3].trim()};
  // Count units (e.g. "2 cans", "1 bunch")
  const m3=text.match(/^(x\s*\d+|\d+\s+(?:can|tin|jar|bag|pack|bunch|clove|sprig|slice|rasher)s?)\s+(.+)/i);
  if(m3)return{qty:m3[1].trim(),name:m3[2].trim()};
  return{qty:'',name:text};
}

// Parse an ingredient string into { amount (number), unit (string), baseName (string) }
function parseIngredient(text){
  if(!text)return{amount:0,unit:'',baseName:''};
  const t=text.trim();
  // Match leading number + optional unit
  const m=t.match(/^([\d]+(?:[.,][\d]+)?(?:\/[\d]+)?)\s*(g|kg|ml|l|ltr|tsp|tbsp|cups?|oz|lb|x\d+)?\s*(.*)/i);
  if(m){
    let amount=parseFloat(m[1].replace(',','.'));
    let unit=(m[2]||'').toLowerCase().replace(/s$/,''); // normalise plural
    if(unit==='ltr')unit='l';
    if(unit==='cup')unit='cup';
    const baseName=m[3].trim().toLowerCase().replace(/[^a-z0-9 ]/g,'').replace(/\s+/g,' ');
    return{amount,unit,baseName};
  }
  // No number found
  const baseName=t.toLowerCase().replace(/[^a-z0-9 ]/g,'').replace(/\s+/g,' ');
  return{amount:1,unit:'',baseName};
}

// Convert amount to a common base for comparison (everything to g/ml where possible)
function toBase(amount,unit){
  if(unit==='kg')return{amount:amount*1000,unit:'g'};
  if(unit==='l')return{amount:amount*1000,unit:'ml'};
  return{amount,unit};
}

// Normalise ingredient name for pantry key matching
function pantryKey(text){
  return text.toLowerCase()
    .replace(/[^a-z0-9 ]/g,'')
    .replace(/\b(large|medium|small|fresh|dried|frozen|ground|chopped|diced|sliced|tinned|canned|heaped|level|rinsed|drained)\b/g,'')
    .replace(/\s+/g,' ').trim();
}

// Given a recipe ingredient string + batches, return how much pantry covers
// Returns { covered: bool, shortfall: string (ingredient with reduced qty) }
function checkPantry(ing,batches,pantry){
  const needed=parseIngredient(ing);
  const neededAmount=needed.amount*(batches||1);
  const neededBase=toBase(neededAmount,needed.unit);
  const key=pantryKey(needed.baseName||ing);
  const item=pantry[key];
  if(!item||!item.amount)return{covered:false,shortfall:null};
  const haveBase=toBase(item.amount,item.unit||'');
  // Units must be compatible (same unit family)
  const compatible=neededBase.unit===haveBase.unit||(neededBase.unit===''&&haveBase.unit==='');
  if(!compatible)return{covered:false,shortfall:null};
  if(haveBase.amount>=neededBase.amount)return{covered:true,shortfall:null};
  // Partial — calculate how much still needed
  const stillNeeded=neededBase.amount-haveBase.amount;
  const shortfall=scaleIngredient(ing,stillNeeded/neededAmount);
  return{covered:false,shortfall};
}

function Shopping({plan,allRecipes,viewKey,shopChecked,onToggleShop,shopEdits,onShopEdit,shopRemoved,onShopRemove,onShopRestore,shopExtras,setShopExtras,essentials,setEssentials,essChecked,onToggleEss,adhoc,setAdhoc,adhocChecked,onToggleAdhoc,catOverrides,onCatOverride,pantry}){
  const[activeTab,setActiveTab]=useState('master');
  const[coll,setColl]=useState({});
  const[newEss,setNewEss]=useState('');
  const[newEssCat,setNewEssCat]=useState('');
  const[newAdhoc,setNewAdhoc]=useState('');
  const[newAdhocCat,setNewAdhocCat]=useState('');
  const[newExtra,setNewExtra]=useState('');
  const[newExtraCat,setNewExtraCat]=useState('');
  const[newMaster,setNewMaster]=useState('');
  const[newMasterCat,setNewMasterCat]=useState('');
  const[newMasterType,setNewMasterType]=useState('adhoc'); // 'adhoc' | 'ess'
  const[editingKey,setEditingKey]=useState(null);
  const[editQty,setEditQty]=useState('');
  const[editName,setEditName]=useState('');
  const[editCat,setEditCat]=useState('');
  const[editingQtyKey,setEditingQtyKey]=useState(null);
  const[qtyVal,setQtyVal]=useState('');
  const[changingCatKey,setChangingCatKey]=useState(null); // item key whose category is being changed
  const weekShop=shopChecked[viewKey]||{};
  const weekEdits=shopEdits[viewKey]||{};
  const weekRemoved=shopRemoved[viewKey]||{};
  const weekExtras=shopExtras[viewKey]||[];
  const weekAdhoc=Array.isArray(adhoc)?[]:(adhoc[viewKey]||[]); // week-scoped extra items

  const{plannedMeals,grouped,recipeBatches}=useMemo(()=>{
    const bulkCookList=plan.bulkCook||[];
    const addToListSlots=plan.addToList||[];
    const servingsNeeded={};
    Object.entries(plan).forEach(([day,dayPlan])=>{
      if(day==='bulkCook'||day==='addToList'||!dayPlan||typeof dayPlan!=='object')return;
      const add=(name,slot,count)=>{
        if(!name||SKIP_RECIPE.includes(name)||bulkCookList.includes(name))return;
        // Only include if explicitly opted in via "Add to list"
        if(!addToListSlots.includes(`${day}_${slot}`))return;
        servingsNeeded[name]=(servingsNeeded[name]||0)+count;
      };
      add(dayPlan.dinner,'dinner',2);
      add(dayPlan.alex,'alex',1);
      add(dayPlan.sam,'sam',1);
    });
    const allMealNames=new Set();
    Object.entries(plan).forEach(([day,dayPlan])=>{
      if(day==='bulkCook'||day==='addToList'||!dayPlan||typeof dayPlan!=='object')return;
      [dayPlan.dinner,dayPlan.alex,dayPlan.sam].forEach(m=>{
        if(m&&!SKIP_RECIPE.includes(m)&&allRecipes.find(r=>r.name===m))allMealNames.add(m);
      });
    });
    const batches={};
    Object.entries(servingsNeeded).forEach(([name,needed])=>{
      const rec=allRecipes.find(r=>r.name===name);
      if(!rec)return;
      batches[name]=Math.max(1,Math.ceil(needed/(rec.serves||1)));
    });
    bulkCookList.forEach(name=>{if(allMealNames.has(name))batches[name]=1;});
    const map={};
    [...allMealNames].forEach(name=>{
      const rec=allRecipes.find(r=>r.name===name);
      if(!rec||!batches[name])return;
      const b=batches[name];
      const isBulk=bulkCookList.includes(name);
      rec.ingredients?.forEach(ing=>{
        const k=ing.toLowerCase().replace(/[^a-z0-9 ]/g,'').trim();
        // Check pantry
        const {covered,shortfall}=checkPantry(ing,b,pantry||{});
        if(covered)return; // pantry has enough — skip
        const displayIng=shortfall||ing; // reduced qty if partial
        const scaled=b>1&&!shortfall?scaleIngredient(displayIng,b):displayIng;
        if(!map[k])map[k]={item:scaled,rawItem:ing,recipes:[name],section:cat(ing,catOverrides),batches:b,bulk:isBulk,fromPantry:!!shortfall};
        else if(!map[k].recipes.includes(name))map[k].recipes.push(name);
      });
    });
    const grps={};
    Object.values(map).forEach(e=>{if(!grps[e.section])grps[e.section]=[];grps[e.section].push(e);});
    return{
      plannedMeals:[...allMealNames],
      grouped:SECTIONS.map(s=>({...s,items:grps[s.id]||[]})).filter(s=>s.items.length>0),
      recipeBatches:batches,
    };
  },[plan,allRecipes,catOverrides,pantry]);

  // Get the display text + qty+name split for an item key
  const getDisplay=(k,defaultText)=>{
    const e=weekEdits[k];
    if(e&&typeof e==='object')return{qty:e.qty??'',name:e.name??defaultText};
    if(typeof e==='string'){const s=splitIngredient(e);return s;} // legacy string edits
    return splitIngredient(defaultText);
  };

  const startEdit=(k,defaultText,rawText)=>{
    const{qty,name}=getDisplay(k,defaultText);
    const currentCat=catOverrides[(rawText||defaultText).toLowerCase().replace(/[^a-z0-9 ]/g,'').trim()]||'';
    setEditQty(qty);setEditName(name);setEditCat(currentCat);setEditingKey(k);
  };
  const saveEdit=(k,rawText)=>{
    const qty=editQty.trim();const name=editName.trim();
    if(!name)return;
    onShopEdit(k,{qty,name});
    if(editCat){
      const rk=(rawText||name).toLowerCase().replace(/[^a-z0-9 ]/g,'').trim();
      if(rk)onCatOverride({...catOverrides,[rk]:editCat});
    }
    setEditingKey(null);
  };
  const cancelEdit=()=>setEditingKey(null);

  const startQtyEdit=(k,currentQty)=>{setEditingQtyKey(k);setQtyVal(currentQty);};
  const saveQtyEdit=(k,defaultText)=>{
    const{name}=getDisplay(k,defaultText);
    onShopEdit(k,{qty:qtyVal.trim(),name});
    setEditingQtyKey(null);
  };

  const saveCat=(itemKey,rawText,sectionId)=>{
    const k=rawText.toLowerCase().replace(/[^a-z0-9 ]/g,'').trim();
    const updated={...catOverrides,[k]:sectionId};
    onCatOverride(updated);
    setChangingCatKey(null);
  };

  const resetItem=(k)=>onShopEdit(k,null);

  const saveWithCat=(text,catChoice)=>{
    if(!catChoice)return;
    const k=text.toLowerCase().replace(/[^a-z0-9 ]/g,'').trim();
    if(k)onCatOverride({...catOverrides,[k]:catChoice});
  };

  const addExtra=()=>{
    const t=newExtra.trim();if(!t)return;
    saveWithCat(t,newExtraCat);
    const updated={...shopExtras,[viewKey]:[...weekExtras,{id:Date.now(),text:t}]};
    setShopExtras(updated);setNewExtra('');setNewExtraCat('');
  };
  const removeExtra=(id)=>{
    const updated={...shopExtras,[viewKey]:weekExtras.filter(e=>e.id!==id)};
    setShopExtras(updated);
  };

  const addEss=()=>{
    const t=newEss.trim();if(!t)return;
    saveWithCat(t,newEssCat);
    setEssentials([...essentials,t]);setNewEss('');setNewEssCat('');
  };
  const addMasterItem=()=>{
    const t=newMaster.trim();if(!t)return;
    saveWithCat(t,newMasterCat);
    if(newMasterType==='ess'){
      setEssentials([...essentials,t]);
    } else {
      const next={...adhoc,[viewKey]:[...weekAdhoc,{text:t,id:Date.now()}]};
      setAdhoc(next);
    }
    setNewMaster('');setNewMasterCat('');
  };
  const addAdhoc=()=>{
    const t=newAdhoc.trim();if(!t)return;
    saveWithCat(t,newAdhocCat);
    const next={...adhoc,[viewKey]:[...weekAdhoc,{text:t,id:Date.now()}]};
    setAdhoc(next);setNewAdhoc('');setNewAdhocCat('');
  };
  const masterDelete=(item)=>{
    if(item.src==='ess'){
      // Hide from this week's master/shopping only — does NOT remove from essentials list
      // Use a week-scoped removal key so it reappears next week
      const weekKey='week_ess_'+viewKey+'_'+item.key;
      onShopRemove(weekKey);
    } else if(item.src==='adhoc'){
      const id=item.key.replace('adhoc_','');
      const next={...adhoc,[viewKey]:weekAdhoc.filter(i=>String(i.id)!==id)};
      setAdhoc(next);
    } else {
      onShopRemove(item.key);
    }
  };

  const adhocDoneCount=weekAdhoc.filter(item=>adhocChecked['adhoc_'+item.id]).length;
  const clearDoneAdhoc=()=>setAdhoc({...adhoc,[viewKey]:weekAdhoc.filter(item=>!adhocChecked['adhoc_'+item.id])});

  const removedCount=Object.keys(weekRemoved).filter(k=>weekRemoved[k]).length;
  const visibleCount=grouped.reduce((a,g)=>a+g.items.filter(e=>{const k=e.item.toLowerCase().replace(/[^a-z0-9]/g,'_');return!weekRemoved[k];}).length,0)+weekExtras.length;

  // Shared category selector for add rows
  function CatSelect({value,onChange}){
    return(
      <select className='hl-catsel' value={value} onChange={e=>onChange(e.target.value)}>
        <option value=''>🗂 Aisle (auto)</option>
        {SECTIONS.map(s=><option key={s.id} value={s.id}>{s.label}</option>)}
      </select>
    );
  }

  const tabs=[
    {id:'master',label:'Master List',count:null},
    {id:'meals',label:'From Your Meals',count:visibleCount||null},
    {id:'adhoc',label:'Extra Items',count:weekAdhoc.length||null},
    {id:'ess',label:'Essentials',count:null},

  // Renders one item row for the meals list (auto-gen or manual extra)

      <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,.4)',zIndex:9999,display:'flex',alignItems:'flex-end',justifyContent:'center'}}

              <div style={{fontFamily:"'Playfair Display',serif",fontSize:16,color:'#F0E6CA'}}>Change Aisle</div>

                  color:s.id===currentCat?'#2A4A1E':'#2C2416',
                  fontWeight:s.id===currentCat?600:400}}>
                {s.label}
                {s.id===currentCat&&<span style={{marginLeft:'auto',fontSize:12,color:'#8CAD78'}}>✓ current</span>}
              </div>
            ))}
            {catOverrides[rawText.toLowerCase().replace(/[^a-z0-9 ]/g,'').trim()]&&(
              <div onClick={()=>{const k=rawText.toLowerCase().replace(/[^a-z0-9 ]/g,'').trim();const u={...catOverrides};delete u[k];onCatOverride(u);setChangingCatKey(null);}}
                style={{padding:'13px 18px',cursor:'pointer',fontSize:13,fontFamily:"'DM Sans',sans-serif",color:'#C4784A',background:'#FEF9F4',borderTop:'2px dashed #E8D8C8'}}>
                ↺ Reset to default category
              </div>
            )}
          </div>
        </div>

  function ItemRow({itemKey,defaultText,rawText,forRecipes,isManual,onDelete,batchCount,label,fromPantry}){

    const done=weekShop[itemKey];
    const isEditing=editingKey===itemKey;
    const isEditingQty=editingQtyKey===itemKey;
    const isEdited=!!weekEdits[itemKey];

    if(isEditing) return(
      <div className='hl-si' style={{flexDirection:'column',alignItems:'stretch',gap:6,padding:'10px 18px'}}>
        <div className='hl-edit-row'>
          <input className='hl-qty-input' placeholder='qty' value={editQty} onChange={e=>setEditQty(e.target.value)} style={{width:70}}/>
          <input className='hl-inline-input' placeholder='item name' value={editName} onChange={e=>setEditName(e.target.value)} onKeyDown={e=>{if(e.key==='Enter')saveEdit(itemKey,rawText||defaultText);if(e.key==='Escape')cancelEdit();}} autoFocus/>
          <button className='hl-inline-save' onClick={()=>saveEdit(itemKey,rawText||defaultText)}>✓</button>
          {isEdited&&<button className='hl-restore-btn' onClick={()=>resetItem(itemKey)} title='Reset'>↺</button>}
          <button className='hl-editbtn' onClick={cancelEdit}>✕</button>
        </div>
        <div style={{display:'flex',alignItems:'center',gap:8}}>
          <span style={{fontSize:10,color:'#9A8E7A',fontFamily:"'DM Sans',sans-serif",flexShrink:0}}>Aisle:</span>
          <CatSelect value={editCat} onChange={setEditCat}/>
        </div>
      </div>
    );

    return(
      <>
        <div className={'hl-si'+(done?' done':'')+(isManual?' hl-manual-item':'')}>
          <div className='hl-cb' onClick={()=>onToggleShop(itemKey)}>{done?'✓':''}</div>
          {isEditingQty
            ?<input className='hl-qty-input' value={qtyVal} autoFocus onChange={e=>setQtyVal(e.target.value)} onBlur={()=>saveQtyEdit(itemKey,defaultText)} onKeyDown={e=>{if(e.key==='Enter')saveQtyEdit(itemKey,defaultText);if(e.key==='Escape')setEditingQtyKey(null);}}/>
            :<span className='hl-qty' onClick={()=>!done&&startQtyEdit(itemKey,qty)} title='Edit quantity'>{qty||'+'}</span>
          }
          <div style={{flex:1,cursor:'pointer'}} onClick={()=>onToggleShop(itemKey)}>
            <div className='hl-in'>{name}{isEdited&&<span style={{fontSize:9,color:'#C4784A',marginLeft:5}}>edited</span>}{label&&<span style={{fontSize:9,background:'#EAF2E5',color:'#3A6B2A',borderRadius:4,padding:'0 5px',marginLeft:5,fontWeight:600}}>{label}</span>}</div>
            {forRecipes&&<div className='hl-src'>
              For: {forRecipes.join(', ')}
              {batchCount>1&&<span style={{marginLeft:5,background:'#FEF0E8',color:'#C4784A',borderRadius:4,padding:'0 5px',fontSize:9,fontWeight:700,fontStyle:'normal'}}>×{batchCount} batch</span>}
              {fromPantry&&<span style={{marginLeft:5,background:'#EAF2E5',color:'#2A4A1E',borderRadius:4,padding:'0 5px',fontSize:9,fontWeight:700}}>🧊 reduced from pantry</span>}
            </div>}
          </div>
          <button className='hl-editbtn' onClick={()=>startEdit(itemKey,defaultText,rawText||defaultText)} title='Edit'>✏️</button>
          <button className='hl-delbtn' onClick={onDelete} title='Remove'>✕</button>
        </div>
        {changingCatKey===itemKey&&ReactDOM.createPortal(
          <CatPicker itemKey={itemKey} rawText={rawText||defaultText} currentCat={cat(rawText||defaultText,catOverrides)} onClose={()=>setChangingCatKey(null)}/>,
          document.body
        )}
      </>
    );
  }

  return <div>
    <h1 className='hl-h1'>Shopping Lists</h1>
    <p className='hl-sub'>Tap qty pill to change amount · ✏️ to edit name · ✕ to remove</p>
    <div className='hl-stabs'>
      {tabs.map(t=>(
        <button key={t.id} className={'hl-st'+(activeTab===t.id?' on':'')} onClick={()=>setActiveTab(t.id)}>
          {t.label}{t.count>0&&<span className='hl-bdg'>{t.count}</span>}
        </button>
      ))}
    </div>

    {activeTab==='master'&&(()=>{
      // Build one flat item pool from ALL sources, then group by aisle
      const allItems=[];

      // 1. Meal ingredients (not removed)
      grouped.forEach(sec=>{
        sec.items.forEach(e=>{
          const k=e.item.toLowerCase().replace(/[^a-z0-9]/g,'_');
          if(weekRemoved[k])return;
          allItems.push({
            key:k,
            text:e.item,
            src:'meals',
            section:e.section||sec.id,
            batches:e.batches||1,
            recipes:e.recipes,
          });
        });
      });

      // 2. Manually added this week
      weekExtras.forEach(item=>{
        const k='extra_'+item.id;
        const display=weekEdits[k]?.name||item.text;
        allItems.push({key:k,text:display,src:'meals',section:cat(display,catOverrides)});
      });

      // 3. Essentials (skip any hidden this week)
      essentials.forEach(item=>{
        const k='ess_'+item.toLowerCase().replace(/[^a-z0-9]/g,'_');
        const weekRemovedKey='week_ess_'+viewKey+'_'+k;
        if(weekRemoved[weekRemovedKey])return;
        allItems.push({key:k,text:item,src:'ess',section:cat(item,catOverrides)});
      });

      // 4. Extra Items (adhoc)
      weekAdhoc.forEach(item=>{
        const k='adhoc_'+item.id;
        allItems.push({key:k,text:item.text,src:'adhoc',section:cat(item.text,catOverrides)});
      });

      // Group by aisle in SECTIONS order
      const aisleMap={};
      allItems.forEach(item=>{
        const sid=item.section||'other';
        if(!aisleMap[sid])aisleMap[sid]=[];
        aisleMap[sid].push(item);
      });
      const sections=SECTIONS
        .map(s=>({...s,items:aisleMap[s.id]||[]}))
        .filter(s=>s.items.length>0);

      const totalItems=allItems.length;
      const doneCount=allItems.filter(i=>{
        if(i.src==='ess') return essChecked[i.key];
        if(i.src==='adhoc') return adhocChecked[i.key];
        return weekShop[i.key];
      }).length;

      const toggleMaster=(item)=>{
        if(item.src==='ess') onToggleEss(item.key);
        else if(item.src==='adhoc') onToggleAdhoc(item.key);
        else onToggleShop(item.key);
      };
      const isDone=(item)=>{
        if(item.src==='ess') return essChecked[item.key];
        if(item.src==='adhoc') return adhocChecked[item.key];
        return weekShop[item.key];
      };

      // Small source badge so you can see where each item comes from
      const SrcBadge=({src})=>{
        if(src==='ess') return <span style={{fontSize:9,background:'#EAF5EE',color:'#4A8A5A',borderRadius:4,padding:'0 5px',fontWeight:700,marginLeft:5,flexShrink:0}}>ESS</span>;
        if(src==='adhoc') return <span style={{fontSize:9,background:'#F0EEF8',color:'#6A5A8A',borderRadius:4,padding:'0 5px',fontWeight:700,marginLeft:5,flexShrink:0}}>EXTRA</span>;
        return null;
      };

      return <div className='hl-scard'>
        <div className='hl-shead bg-master' style={{justifyContent:'space-between'}}>
          <span>📋 Master Shopping List</span>
          <span style={{fontSize:11,opacity:.8}}>{doneCount}/{totalItems} done</span>
        </div>
        {totalItems===0
          ?<div className='hl-empty'>Add meals to your plan and items to your lists<br/>and they'll all appear here ✨</div>
